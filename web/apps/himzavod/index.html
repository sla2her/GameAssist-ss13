<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Химзавод SS13</title>
<style>
:root{
  --bg:#15171b; --panel:#1d2026; --panel2:#252931; --line:#343a44; --text:#d7dce3; --muted:#8a93a0;
  --accent:#4f9cf0; --red:#e0524a; --blue:#4a8fe0; --ok:#4cc27a; --warn:#e0a84a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 10px 0 0;font-weight:600}
header .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=number]{width:70px}
main{flex:1;display:flex;min-height:0}
#tools{width:210px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
#tools h3,#insp h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 6px}
#tools h3:first-child{margin-top:0}
.tool{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:3px;padding:4px 6px}
.tool .sw{width:18px;height:18px;border-radius:3px;flex:none;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.tool .k{margin-left:auto;color:var(--muted);font-size:11px}
.tool.on .k{color:#fff}
.row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.row label{color:var(--muted);min-width:60px}
#wrap{flex:1;position:relative;min-width:0;background:#0f1114}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#insp{width:290px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:8px 10px}
#insp .muted{color:var(--muted)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.card .title{font-weight:600;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:11px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#30353f;border-radius:10px;padding:1px 4px 1px 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip button{padding:0 5px;border:none;background:transparent;color:var(--muted)}
.chip button:hover{color:var(--red)}
.reag{display:flex;align-items:center;gap:6px;font-size:12px}
.reag .dot{width:9px;height:9px;border-radius:50%}
.reag .v{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#30353f;border-radius:3px;overflow:hidden;margin:4px 0}
.bar > div{height:100%;background:var(--accent)}
.port{font-size:12px;display:flex;gap:6px;align-items:center}
.port .p{width:10px;height:10px;border-radius:2px}
.warn{color:var(--warn);font-size:12px;margin-top:4px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;padding:2px 7px}
.seg button:first-child{border-radius:4px 0 0 4px}
.seg button:last-child{border-radius:0 4px 4px 0}
footer{padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:16px}
footer b{color:var(--text);font-weight:500}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:300px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 12px;font-size:15px}
dialog .row label{min-width:90px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.legend{font-size:11px;color:var(--muted);line-height:1.6}
@media (max-width: 900px){
  body{overflow:auto}
  main{flex-wrap:wrap;min-height:auto}
  #wrap{order:-1;flex:1 1 100%;height:62vh}
  #tools,#insp{flex:1 1 240px;width:auto;border:none;border-top:1px solid var(--line)}
  footer{flex-wrap:wrap}
}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>Химзавод · SS13 (BlueMoon)</h1>
  <button id="bSize" title="Изменить размер поля">Размер поля…</button>
  <span class="sep"></span>
  <button id="bPlay" title="Пробел">▶ Пуск</button>
  <button id="bStep" title="Один тик (2 сек игрового времени)">Шаг</button>
  <select id="speed" title="Скорость симуляции">
    <option value="1">×1 (тик = 2 с)</option>
    <option value="4">×4</option>
    <option value="10" selected>×10</option>
    <option value="50">×50</option>
  </select>
  <button id="bReset" title="Очистить содержимое машин, не трогая постройки">Сбросить химикаты</button>
  <span id="tickInfo" style="color:var(--muted)">Тик 0</span>
  <span class="sep"></span>
  <button id="bExport">Экспорт</button>
  <button id="bImport">Импорт</button>
  <input type="file" id="fImport" accept=".json,application/json" hidden>
  <button id="bDemo" title="Пример: каломель. 2 синтезатора → реакционная камера → цистерна → акклиматор (380 K) → вывод">Пример</button>
  <button id="bClear">Очистить поле</button>
</header>
<main>
  <aside id="tools">
    <div id="toolsDyn"></div>
    <h3>База реакций</h3>
    <div id="chemInfo" class="legend"></div>
    <label for="chemLink" class="legend" style="display:block;margin-top:6px">Ссылка на билд (GitHub):</label>
    <input id="chemLink" spellcheck="false" placeholder="https://github.com/BlueMoon-Labs/MOLOT-BlueMoon-Station" style="width:100%;margin-top:3px">
    <div class="row"><button id="chemUpdate" class="on">Обновить реакции</button><button id="chemReset" title="Вернуть базу, встроенную в программу">Встроенная</button></div>
    <div class="legend" style="margin-top:6px">или из локальной копии билда, без интернета:</div>
    <div class="row">
      <button id="chemDir" title="Папка репозитория (или любая папка, где внутри лежит code\)">Из папки…</button>
      <button id="chemZip" title="Архив репозитория, например скачанный с GitHub через Code → Download ZIP">Из .zip…</button>
    </div>
    <input type="file" id="chemDirIn" webkitdirectory directory multiple hidden>
    <input type="file" id="chemZipIn" accept=".zip,application/zip" hidden>
    <div id="chemStatus" class="legend"></div>
  </aside>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside id="insp"></aside>
</main>
<footer>
  <span id="stHover">—</span>
  <span id="stTool"></span>
  <span style="margin-left:auto">ЛКМ — действие · ПКМ — снести · R — повернуть · колесо — масштаб · СКМ/пробел+ЛКМ — двигать</span>
</footer>

<dialog id="sizeDlg">
  <h2>Размер поля</h2>
  <div class="row"><label for="inW">Ширина (тайлы)</label><input type="number" id="inW" min="3" max="200"></div>
  <div class="row"><label for="inH">Длина (тайлы)</label><input type="number" id="inH" min="3" max="200"></div>
  <div class="row"><label></label>
    <button data-sz="10x8">10×8</button><button data-sz="20x14">20×14</button><button data-sz="32x24">32×24</button><button data-sz="50x40">50×40</button>
  </div>
  <div class="warn" id="sizeWarn"></div>
  <div class="actions"><button id="sizeCancel">Отмена</button><button id="sizeOk" class="on">Применить</button></div>
</dialog>

<datalist id="reagList"></datalist>

<script>// DM (BYOND) chemistry parser: extracts reagents, chemical reactions and
// chem dispenser lists from MOLOT-BlueMoon-Station source files.
// Works both in Node (build step) and in the browser (sync-with-GitHub button).
(function (root) {
  'use strict';

  const REPO = 'BlueMoon-Labs/MOLOT-BlueMoon-Station';
  const BRANCH = 'master';

  // Which repository files hold chemistry data. Applied to the GitHub tree listing.
  function isRelevantPath(p) {
    if (!/\.dm$/.test(p)) return false;
    if (/reagent_containers/.test(p)) return false;
    return /_DEFINES\//.test(p) ||
      /modules\/reagents\//.test(p) ||
      /food_and_drinks\/recipes\/[^/]+\.dm$/.test(p) ||
      /resize\/sizechems/.test(p) ||
      /terror_spiders\/chem/.test(p);
  }

  // Путь файла из локальной копии (папка или zip, корень может быть любым) -> путь от корня репозитория.
  const ROOT_DIRS = ['code', 'modular_citadel', 'modular_sand', 'modular_splurt', 'modular_bluemoon'];
  function localRelPath(p) {
    const parts = String(p).replace(/\\/g, '/').split('/');
    const i = parts.findIndex((s) => ROOT_DIRS.includes(s));
    return i < 0 ? null : parts.slice(i).join('/');
  }

  // DM compiles core code first, then modular folders override it.
  function fileOrder(p) {
    if (/_DEFINES\//.test(p)) return 0;
    if (p.startsWith('code/')) return 1;
    if (p.startsWith('modular_citadel/')) return 2;
    if (p.startsWith('modular_sand/')) return 3;
    if (p.startsWith('modular_splurt/')) return 4;
    if (p.startsWith('modular_bluemoon/')) return 5;
    return 6;
  }

  // ---------- lexing helpers ----------

  // Removes // and /* */ comments while respecting "strings" and {"multiline"}.
  function stripComments(src) {
    let out = '';
    let i = 0;
    const n = src.length;
    let inStr = false, inMulti = false, inBlock = 0, inLine = false;
    while (i < n) {
      const c = src[i], d = src[i + 1];
      if (inLine) {
        if (c === '\n') { inLine = false; out += c; }
        i++; continue;
      }
      if (inBlock) {
        if (c === '/' && d === '*') { inBlock++; i += 2; continue; }
        if (c === '*' && d === '/') { inBlock--; i += 2; continue; }
        if (c === '\n') out += c;
        i++; continue;
      }
      if (inMulti) {
        out += c;
        if (c === '"' && d === '}') { out += d; inMulti = false; i += 2; continue; }
        i++; continue;
      }
      if (inStr) {
        out += c;
        if (c === '\\') { out += d || ''; i += 2; continue; }
        if (c === '"' || c === '\n') inStr = false;
        i++; continue;
      }
      if (c === '{' && d === '"') { inMulti = true; out += c + d; i += 2; continue; }
      if (c === '"') { inStr = true; out += c; i++; continue; }
      if (c === '/' && d === '/') { inLine = true; i += 2; continue; }
      if (c === '/' && d === '*') { inBlock = 1; i += 2; continue; }
      out += c; i++;
    }
    return out;
  }

  // Paren balance ignoring strings; used to glue multi-line list(...) values.
  function parenDelta(s) {
    let depth = 0, inStr = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inStr) {
        if (c === '\\') { i++; continue; }
        if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') inStr = true;
      else if (c === '(') depth++;
      else if (c === ')') depth--;
    }
    return depth;
  }

  // Splits at top-level commas.
  function splitTop(s, sep) {
    const parts = [];
    let depth = 0, inStr = false, cur = '';
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inStr) {
        cur += c;
        if (c === '\\') { cur += s[++i] || ''; continue; }
        if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; cur += c; continue; }
      if (c === '(' || c === '[') depth++;
      if (c === ')' || c === ']') depth--;
      if (depth === 0 && s.substr(i, sep.length) === sep) {
        parts.push(cur); cur = ''; i += sep.length - 1; continue;
      }
      cur += c;
    }
    if (cur.trim() !== '') parts.push(cur);
    return parts;
  }

  function indentOf(line) {
    let n = 0;
    for (const ch of line) {
      if (ch === '\t') n += 1;
      else if (ch === ' ') n += 0.25;
      else break;
    }
    return Math.floor(n);
  }

  // ---------- defines ----------

  function collectDefines(text, defines) {
    const re = /^[ \t]*#define[ \t]+([A-Za-z_][A-Za-z0-9_]*)(?![A-Za-z0-9_(])[ \t]*(.*)$/gm;
    let m;
    while ((m = re.exec(text))) {
      let val = m[2].replace(/\/\/.*$/, '').trim();
      if (val === '') continue;
      defines[m[1]] = val;
    }
  }

  // Evaluates simple numeric DM expressions with define substitution.
  function makeEvaluator(defines) {
    const cache = {};
    function evalExpr(expr, depth) {
      depth = depth || 0;
      if (depth > 12) return NaN;
      expr = String(expr).trim();
      if (expr === '') return NaN;
      if (/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(expr)) return parseFloat(expr);
      if (expr === 'TRUE') return 1;
      if (expr === 'FALSE' || expr === 'null') return 0;
      if (expr === 'INFINITY') return Infinity;
      let ok = true;
      let js = expr.replace(/\b([A-Za-z_][A-Za-z0-9_]*)\b/g, (w) => {
        if (w === 'INFINITY') return 'Infinity';
        if (w === 'TRUE') return '1';
        if (w === 'FALSE' || w === 'null') return '0';
        if (w === 'e' ) return w;
        if (w in cache) return String(cache[w]);
        if (w in defines) {
          const v = evalExpr(defines[w], depth + 1);
          cache[w] = v;
          if (isNaN(v)) ok = false;
          return '(' + v + ')';
        }
        ok = false;
        return w;
      });
      if (!ok) return NaN;
      js = js.replace(/\*\*/g, '**');
      if (!/^[\d\s.+\-*/()%<>|&!~^eInfity]*$/.test(js)) return NaN;
      try {
        // eslint-disable-next-line no-new-func
        const v = Function('"use strict";return (' + js + ');')();
        return typeof v === 'number' ? v : NaN;
      } catch (e) { return NaN; }
    }
    return evalExpr;
  }

  // ---------- DM object model ----------

  // Parses one file into type blocks: [{path, vars:{name: raw}, procs:{name: body}}]
  function parseBlocks(text, file) {
    const lines = stripComments(text).replace(/\r/g, '').split('\n');
    const blocks = [];
    let cur = null;      // current type block
    let proc = null;     // {name, body[], indent}
    let pending = null;  // multi-line var accumulation {name, raw, depth}

    function flushPending() {
      if (pending && cur) cur.vars[pending.name] = pending.raw.trim();
      pending = null;
    }

    for (let li = 0; li < lines.length; li++) {
      const raw = lines[li];
      if (pending) {
        pending.raw += ' ' + raw.trim();
        pending.depth += parenDelta(raw);
        if (pending.depth <= 0) flushPending();
        continue;
      }
      if (raw.trim() === '') { if (proc) proc.body.push(''); continue; }
      const ind = indentOf(raw);
      const line = raw.trim();

      if (ind === 0) {
        proc = null;
        if (line.startsWith('#')) { cur = null; continue; }
        const mm = /^\/?((?:datum|obj)\/[A-Za-z0-9_/]+?)(?:\/(?:proc|verb)\/([A-Za-z0-9_]+)|\/([A-Za-z0-9_]+))?\s*\((.*)$/.exec(line);
        if (mm) {
          // proc definition: path/name(args)
          const full = mm[1];
          const name = mm[2] || mm[3];
          let typePath = '/' + full;
          let procName = name;
          if (!name) { // e.g. /datum/foo/bar( -> last segment is the proc
            const idx = full.lastIndexOf('/');
            typePath = '/' + full.slice(0, idx);
            procName = full.slice(idx + 1);
          }
          cur = null;
          proc = { type: typePath, name: procName, body: [], file };
          blocks.push({ path: typePath, vars: {}, procs: {}, file, procOnly: proc });
          continue;
        }
        const tm = /^\/?((?:datum|obj)\/[A-Za-z0-9_/]+)\s*(\{.*)?$/.exec(line);
        if (tm) {
          cur = { path: '/' + tm[1].replace(/\/$/, ''), vars: {}, procs: {}, file };
          blocks.push(cur);
          continue;
        }
        cur = null;
        continue;
      }

      if (proc) { proc.body.push(line); continue; }
      if (!cur) continue;

      if (ind === 1) {
        // indented proc definition inside a type block
        const pm = /^(?:proc\/|verb\/)?([A-Za-z0-9_]+)\s*\(.*\)\s*$/.exec(line);
        if (pm && !line.includes('=')) {
          proc = { type: cur.path, name: pm[1], body: [], file };
          blocks.push({ path: cur.path, vars: {}, procs: {}, file, procOnly: proc });
          continue;
        }
        const vm = /^(?:var\/(?:[A-Za-z0-9_]+\/)*)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/.exec(line);
        if (vm) {
          const val = vm[2];
          const depth = parenDelta(val);
          if (depth > 0) pending = { name: vm[1], raw: val, depth };
          else cur.vars[vm[1]] = val.trim();
        }
      }
    }
    flushPending();
    for (const b of blocks) if (b.procOnly) {
      b.procs[b.procOnly.name] = b.procOnly.body.join('\n');
      delete b.procOnly;
    }
    return blocks;
  }

  function parseString(raw) {
    raw = raw.trim();
    const m = /^"((?:[^"\\]|\\.)*)"/.exec(raw);
    if (m) return m[1].replace(/\\(.)/g, '$1').replace(/\[[^\]]*\]/g, '…').replace(/<[^>]+>/g, '');
    const mm = /^\{"([\s\S]*?)"\}/.exec(raw);
    if (mm) return mm[1].replace(/<[^>]+>/g, '');
    return null;
  }

  // list(/a = 1, /b = 2) -> {"/a": 1, "/b": 2}; list(/a, /b) -> {"/a": 1, ...}
  function parseTypeList(raw, evalExpr) {
    if (!raw) return null;
    raw = raw.trim();
    const m = /^list\s*\(([\s\S]*)\)\s*$/.exec(raw);
    if (!m) return null;
    const out = {};
    for (let part of splitTop(m[1], ',')) {
      part = part.trim();
      if (!part) continue;
      const kv = splitTop(part, '=');
      const key = kv[0].trim();
      if (!/^\/[A-Za-z0-9_/]+$/.test(key)) continue;
      let val = kv.length > 1 ? evalExpr(kv.slice(1).join('=')) : 1;
      if (isNaN(val)) val = 1;
      out[key] = val;
    }
    return out;
  }

  // ---------- effect extraction (heuristic, from on_mob_life code) ----------

  const DAMAGE_FNS = {
    adjustBruteLoss: 'brute', adjustFireLoss: 'burn', adjustToxLoss: 'tox',
    adjustOxyLoss: 'oxy', adjustCloneLoss: 'clone', adjustStaminaLoss: 'stamina',
  };

  function extractEffects(body, evalExpr) {
    const eff = {};
    function put(k, v, cond) {
      if (isNaN(v) || !isFinite(v)) return;
      if (!eff[k]) eff[k] = { min: v, max: v, cond: !!cond };
      else { eff[k].min = Math.min(eff[k].min, v); eff[k].max = Math.max(eff[k].max, v); if (cond) eff[k].cond = true; }
    }
    const ev = (e) => evalExpr(e.replace(/\bdelta_time\b|\bseconds_per_tick\b/g, '1').replace(/\bREM\b/g, 'REM'));
    const lines = body.split('\n');
    let indentCond = false;
    for (const l of lines) {
      if (/^\s*(if|else|switch|for|while)\b/.test(l)) indentCond = true;
      let m;
      const re = /\b(adjust(?:Brute|Fire|Tox|Oxy|Clone|Stamina)Loss)\(\s*([^,)]+)/g;
      while ((m = re.exec(l))) put(DAMAGE_FNS[m[1]], ev(m[2]), indentCond);
      const hb = /\bheal_bodypart_damage\(\s*([^,)]+)\s*,\s*([^,)]+)/.exec(l);
      if (hb) { put('brute', -ev(hb[1]), indentCond); put('burn', -ev(hb[2]), indentCond); }
      const ob = /\badjustOrganLoss\(\s*ORGAN_SLOT_(\w+)\s*,\s*([^,)]+)/.exec(l);
      if (ob) put('organ_' + ob[1].toLowerCase(), ev(ob[2]), indentCond);
      const rad = /\bradiation\s*-=\s*(?:min\([^,]+,\s*)?([\d.]+)/.exec(l);
      if (rad) put('radiation', -parseFloat(rad[1]), indentCond);
      const bl = /\bblood_volume\s*(\+|-)=\s*([^\s/]+)/.exec(l);
      if (bl) put('blood', (bl[1] === '+' ? 1 : -1) * ev(bl[2]), indentCond);
    }
    return eff;
  }

  // ---------- main ----------

  function parseFiles(files) {
    files = files.slice().sort((a, b) => fileOrder(a.path) - fileOrder(b.path) || a.path.localeCompare(b.path));
    const defines = {};
    for (const f of files) collectDefines(f.text, defines);
    const evalExpr = makeEvaluator(defines);

    const types = {};   // path -> {vars, procs, file, order}
    let order = 0;
    for (const f of files) {
      for (const b of parseBlocks(f.text, f.path)) {
        if (!/^\/(datum\/(reagent|chemical_reaction)|obj\/machinery\/chem_dispenser)/.test(b.path)) continue;
        let t = types[b.path];
        if (!t) t = types[b.path] = { vars: {}, procs: {}, file: b.file, order: order++, declared: false };
        if (Object.keys(b.vars).length || !Object.keys(b.procs).length) t.declared = true;
        Object.assign(t.vars, b.vars);
        Object.assign(t.procs, b.procs);
        if (!t.declared) t.file = b.file;
      }
    }

    function ancestors(path) {
      const segs = path.split('/').filter(Boolean);
      const out = [];
      for (let i = 1; i <= segs.length; i++) out.push('/' + segs.slice(0, i).join('/'));
      return out;

    if (!branch) {

// ===== Направления (как в BYOND) =====
const N = 1, S = 2, E = 4, W = 8;
const CARD = [N, S, E, W]; // GLOB.cardinals
const DXY = { 1: [0, -1], 2: [0, 1], 4: [1, 0], 8: [-1, 0] };
const D2A = { 1: 0, 4: 90, 2: 180, 8: 270 }; // dir2angle
const CCW = [N, W, S, E];
// turn(): положительный угол — против часовой, как в BYOND
function turn(d, a) { a = ((a % 360) + 360) % 360; return CCW[(CCW.indexOf(d) + a / 90) % 4]; }
const opp = d => turn(d, 180);

// plumbing/update_dir(): соединения заданы для машины, смотрящей на ЮГ
function rotMask(mask, facing) {
  if (facing === S) return mask;
  const ang = 180 - D2A[facing];
  let r = 0;
  for (const d of CARD) if (mask & d) r |= turn(d, ang);
  return r;
}

// ===== Состояние =====
const st = {
  w: 20, h: 14,
  machines: [],        // порядок = порядок обработки
  ducts: new Map(),    // "x,y,layer" -> {x,y,layer,color}
  nextId: 1, tick: 0,
};
let nets = [], ductInfo = new Map(); // key -> {net, conn}
let tool = 'select', placeDir = S, ductColor = 'grey', ductLayer = DEFAULT_LAYER;
let selected = null; // {x,y}
let hover = null;
let running = false;

const dkey = (x, y, l) => `${x},${y},${l}`;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < st.w && y < st.h;
const machineAt = (x, y) => st.machines.find(m => m.x === x && m.y === y) || null;
const ductsAt = (x, y) => LAYERS.map(l => st.ducts.get(dkey(x, y, l))).filter(Boolean);

function makeMachine(type, x, y, dir) {
  const def = DEFS[type];
  return Object.assign({ id: st.nextId++, type, x, y, dir, reag: {}, pur: {}, temp: 300, pH: 7, fermi: null, maxVol: def.buffer }, structuredClone(def.init));
}
const sup = m => rotMask(DEFS[m.type].sup, m.dir);
const dem = m => rotMask(DEFS[m.type].dem, m.dir);

// ===== Построение сетей (ductnet) =====
function rebuild() {
  nets = []; ductInfo = new Map();
  let nid = 1;
  // Умные трубы сами соединяются с соседними трубами того же слоя и цвета
  for (const [k, d] of st.ducts) {
    if (ductInfo.has(k)) continue;
    const net = { id: nid++, ducts: [], suppliers: [], demanders: [] };
    nets.push(net);
    const q = [d]; ductInfo.set(k, { net, conn: 0 });
    while (q.length) {
      const c = q.shift(); net.ducts.push(c);
      for (const dir of CARD) {
        const [dx, dy] = DXY[dir];
        const nk = dkey(c.x + dx, c.y + dy, c.layer);
        const nd = st.ducts.get(nk);
        if (!nd || nd.color !== c.color) continue;
        ductInfo.get(dkey(c.x, c.y, c.layer)).conn |= dir;
        if (!ductInfo.has(nk)) { ductInfo.set(nk, { net, conn: 0 }); q.push(nd); }
      }
    }
  }
  // Машины: к трубе стандартного слоя или напрямую к соседней машине (supply -> demand)
  const direct = new Map();
  for (const m of st.machines) {
    m.ports = {};
    m._sup = sup(m); m._dem = dem(m);
  }
  for (const m of st.machines) {
    for (const d of CARD) {
      if (!((m._sup | m._dem) & d)) continue;
      const [dx, dy] = DXY[d];
      const nx = m.x + dx, ny = m.y + dy;
      const dk = dkey(nx, ny, DEFAULT_LAYER);
      let net = null;
      if (st.ducts.has(dk)) {
        const info = ductInfo.get(dk);
        net = info.net; info.conn |= opp(d);
      } else {
        const p = machineAt(nx, ny);
        if (p) {
          const od = opp(d);
          const ok = ((p._dem & od) && (m._sup & d)) || ((p._sup & od) && (m._dem & d));
          if (ok) {
            const pk = [Math.min(m.id, p.id), Math.max(m.id, p.id), m.id < p.id ? d : od].join(':');
            net = direct.get(pk);
            if (!net) { net = { id: nid++, ducts: [], suppliers: [], demanders: [], direct: true }; nets.push(net); direct.set(pk, net); }
          }
        }
      }
      if (!net) continue;
      m.ports[d] = net;
      if (d & m._sup) net.suppliers.push({ m, dir: d }); else net.demanders.push({ m, dir: d });
    }
  }
}

// ===== База реагентов и реакций (из кода билда) =====
// CHEM = { R: {имя: {c, pH, h, imp, inv, iv}}, RX: [{id, n, req, res, cat, t, cold, pr, fx, f}], synth: [...], meta }
let CHEM = null, BYFIRST = {};
function setChem(c) {
  CHEM = c && c.R && c.RX ? c : null;
  BYFIRST = {};
  if (CHEM) for (const x of CHEM.RX) { const k = Object.keys(x.req)[0]; (BYFIRST[k] = BYFIRST[k] || []).push(x); }
  const list = CHEM ? Object.keys(CHEM.R).sort() : SYNTH_REAGENTS;
  document.getElementById('reagList').innerHTML = list.map(r => `<option value="${esc(r)}">`).join('');
}
const synthList = () => (CHEM && CHEM.synth.length ? CHEM.synth : SYNTH_REAGENTS);
const heatOf = n => (CHEM && CHEM.R[n] ? CHEM.R[n].h : 200);
const pHOf = n => (CHEM && CHEM.R[n] ? CHEM.R[n].pH : 7);

// ===== Реагенты (как holder.dm) =====
const Q = 0.001; // CHEMICAL_QUANTISATION_LEVEL
const EPS = 1e-6;
const rnd = (x, q) => Math.round(x / q) * q;
const total = m => { let t = 0; for (const k in m.reag) t += m.reag[k]; return t; };
const heatCap = m => { let s = 0; for (const k in m.reag) s += heatOf(k) * m.reag[k]; return s; };
// update_total(): мелкие остатки удаляются
function clean(m) {
  for (const k in m.reag) if (m.reag[k] <= 0 || (m.reag[k] < 0.01 && !m.fermi)) { delete m.reag[k]; delete m.pur[k]; }
  if (total(m) <= EPS) m.pH = 7;
  if (m.type === 'reaction_chamber' && m.emptying && total(m) <= EPS) m.emptying = false; // on_reagent_change()
}
// add_reagent() без handle_reactions; pH — смешивание с pH источника (trans_to) или самого реагента
function rawAdd(m, name, amt, temp = 300, srcPH = null, pur = 1) {
  if (!(amt >= Q)) return 0;
  const tot = total(m);
  if (tot + amt > m.maxVol) { amt = m.maxVol - tot; if (amt <= 0) return 0; }
  const nt = tot + amt;
  let sh = 0, te = 0;
  for (const k in m.reag) { sh += heatOf(k) * (m.reag[k] / nt); te += heatOf(k) * m.reag[k] * m.temp; }
  sh += heatOf(name) * (amt / nt); te += heatOf(name) * amt * temp;
  m.temp = te / (sh * nt);
  m.pH = (m.pH * tot + (srcPH != null ? srcPH : pHOf(name)) * amt) / nt;
  const had = m.reag[name] || 0;
  m.reag[name] = had + rnd(amt, Q);
  m.pur[name] = had ? ((m.pur[name] ?? 1) * m.reag[name] + pur * amt) / (m.reag[name] + amt) : pur;
  return amt;
}
function rawRemove(m, name, amt, ignorePH) {
  const have = m.reag[name]; if (!have || !(amt >= 0)) return 0;
  const tot = total(m);
  if (!ignorePH && tot > 0) m.pH = ((m.pH - pHOf(name)) / tot) * amt + m.pH;
  amt = Math.min(amt, have);
  m.reag[name] = have - amt;
  return amt;
}
// add_reagent(..., no_react = FALSE): синтезатор, помпа, ручное вливание
function addReag(m, name, amt, temp = 300) {
  const a = rawAdd(m, name, amt, temp);
  clean(m); if (a) handleReactions(m);
  return a;
}
function transTo(src, dst, amount) {
  const t = total(src);
  amount = Math.min(amount, t, dst.maxVol - total(dst));
  if (amount <= EPS || src === dst) return 0;
  const part = amount / t, T = src.temp, pH = src.pH;
  for (const k of Object.keys(src.reag)) {
    const v = src.reag[k] * part;
    rawAdd(dst, k, v, T, pH, src.pur[k] ?? 1);
    rawRemove(src, k, v, true);
  }
  clean(src); clean(dst);
  handleReactions(dst); handleReactions(src);
  return amount;
}
function transId(src, dst, name, amount) {
  amount = Math.min(amount, src.reag[name] || 0, dst.maxVol - total(dst));
  if (amount <= EPS || src === dst) return 0;
  rawAdd(dst, name, amount, src.temp, null, src.pur[name] ?? 1);
  rawRemove(src, name, amount, false);
  clean(src); clean(dst);
  handleReactions(dst);
  return amount;
}
// трансфер в предмет (таблетка, бутылка) или remove_any() утилизатора
function removeAmount(m, amount, ignorePH = true) {
  const t = total(m); amount = Math.min(amount, t); if (amount <= EPS) return 0;
  const part = amount / t;
  for (const k of Object.keys(m.reag)) rawRemove(m, k, m.reag[k] * part, ignorePH);
  clean(m); handleReactions(m);
  return amount;
}

// ===== Реакции (handle_reactions) =====
const LOG = [];
function log(m, text, kind = 'rx') {
  LOG.unshift({ tick: st.tick, mid: m.id, abbr: DEFS[m.type].abbr, text, kind });
  if (LOG.length > 300) LOG.length = 300;
}
const fmtReag = o => Object.entries(o).map(([k, v]) => `${esc(k)} ${r2(v)}`).join(' + ');
// у реакционной камеры холдер создан с NO_REACT, и ui/компонент его не снимают — сама она не реагирует
const canReact = m => CHEM && !m.fermi && m.type !== 'reaction_chamber';
function reactionOk(m, x) {
  for (const b in x.req) if (!((m.reag[b] || 0) >= x.req[b] - 1e-9)) return false;
  for (const b in x.cat) if (!((m.reag[b] || 0) >= x.cat[b] - 1e-9)) return false;
  return x.t === 0 || (x.cold && m.temp <= x.t) || (!x.cold && m.temp >= x.t);
}
function possibleReactions(m) {
  const poss = [], seen = new Set();
  for (const r of Object.keys(m.reag)) for (const x of BYFIRST[r] || []) {
    if (seen.has(x)) continue; seen.add(x);
    if (reactionOk(m, x)) poss.push(x);
  }
  return poss.map((x, i) => [x, i]).sort((a, b) => (b[0].pr - a[0].pr) || (a[1] - b[1])).map(a => a[0]);
}
function handleReactions(m) {
  if (!canReact(m)) return;
  let cont = false;
  for (let guard = 0; guard < 200; guard++) {
    const poss = possibleReactions(m);
    if (!poss.length) break;
    const x = poss[0], F = x.f;
    if (F) {
      if (cont) { if (m.temp > F.tExp) fermiExplode(m, x, 'перегрев'); return; }
      if (m.temp > F.tExp) return fermiExplode(m, x, 'перегрев');
      let mult = Infinity;
      for (const b in x.req) mult = Math.min(mult, rnd(m.reag[b] / x.req[b], 0.0001));
      let target = 0; for (const p in x.res) target = x.res[p] * mult;
      if (!(m.temp >= F.tMin)) return;
      if (!(m.pH >= F.pHMin - F.pHLim && m.pH <= F.pHMax + F.pHLim)) return;
      m.fermi = { id: x.id, target, reacted: 0 };
      log(m, `FermiChem «${esc(x.n)}» запущена (цель ${r2(target)} ед.)`, 'fermi');
      return;
    }
    let mult = Infinity;
    for (const b in x.req) mult = Math.min(mult, rnd(m.reag[b] / x.req[b], Q));
    for (const b in x.req) rawRemove(m, b, mult * x.req[b], true);
    const made = {};
    for (const p in x.res) { mult = Math.max(mult, 1); made[p] = x.res[p] * mult; rawAdd(m, p, made[p], m.temp); }
    clean(m);
    log(m, `«${esc(x.n)}»: ${fmtReag(made)}${x.fx ? ' · эффект: ' + x.fx.join(', ') : ''}`);
    cont = true;
  }
}
// FermiChem: SSprocessing — шаг раз в секунду
const fermiRx = m => CHEM && CHEM.RX.find(x => x.id === m.fermi.id);
function fermiProcess(m) {
  const x = fermiRx(m); if (!x) { m.fermi = null; return; }
  const F = x.f;
  let mult = Infinity;
  for (const b in x.req) mult = Math.min(mult, rnd((m.reag[b] || 0) / x.req[b], 0.0001));
  if (mult <= 0) return fermiEnd(m, x);
  for (const b in x.cat) if (!m.reag[b]) return fermiEnd(m, x);
  if (!(m.temp >= F.tMin)) return fermiEnd(m, x);
  if (!(m.pH >= F.pHMin - F.pHLim && m.pH <= F.pHMax + F.pHLim)) return fermiEnd(m, x);
  const T = m.temp, pH = m.pH;
  let dpH, dT = 0;
  if (pH < F.pHMin) dpH = Math.pow(pH - (F.pHMin - F.pHLim), F.sPH) / Math.pow(F.pHLim, F.sPH);
  else if (pH > F.pHMax) dpH = Math.pow(-pH + (F.pHMax + F.pHLim), F.sPH) / Math.pow(F.pHLim, F.sPH);
  else dpH = 1;
  if (T < F.tMax && T >= F.tMin) dT = Math.pow(T - F.tMin, F.sT) / Math.pow(F.tMax - F.tMin, F.sT);
  else if (T >= F.tMax) dT = 1;
  let pr = 0, n = 0; for (const k in m.reag) { pr += m.pur[k] ?? 1; n++; }
  const purity = dpH * (n ? pr / n : 1);
  let addAmt = 0, remAmt = 0;
  for (const p in x.res) {
    let step = Math.min(mult * x.res[p], F.rate);
    addAmt = dT * step;
    if (addAmt >= m.fermi.target - m.fermi.reacted) addAmt = m.fermi.target - m.fermi.reacted;
    if (addAmt < Q) addAmt = Q;
    remAmt = rnd(addAmt / x.res[p], Q); addAmt = rnd(addAmt, Q);
  }
  for (const b in x.req) rawRemove(m, b, remAmt * x.req[b], true);
  for (const p in x.res) {
    rawAdd(m, p, addAmt, T, null, purity);
    if ((m.pur[p] ?? 1) < F.purMin) return fermiExplode(m, x, `чистота ${Math.round(m.pur[p] * 100)}%`);
  }
  m.temp = Math.floor(T + F.thermic * addAmt);
  m.pH = Math.max(0, Math.min(14, m.pH + F.hIon * addAmt));
  if (m.temp > F.tExp) return fermiExplode(m, x, 'перегрев');
  m.fermi.reacted += addAmt;
  if (rnd(m.fermi.reacted, Q) >= rnd(m.fermi.target, Q) - Q / 2 || !addAmt) fermiEnd(m, x);
}
function fermiEnd(m, x) {
  const st_ = m.fermi; m.fermi = null;
  for (const k in m.reag) m.reag[k] = rnd(m.reag[k], Q);
  const F = x.f;
  if (F.clear) { // FermiFinish: clear_conversion
    for (const p in x.res) {
      const v = m.reag[p], pur = m.pur[p] ?? 1, D = CHEM.R[p];

      if (F.clear === 2 && D.inv && D.iv > pur) { rawRemove(m, p, v, true); rawAdd(m, D.inv, v, m.temp); log(m, `${esc(p)} → ${esc(D.inv)} (низкая чистота)`, 'warn'); }
      else if (F.clear === 1 && D.imp) { const iv = v * (1 - pur); rawRemove(m, p, iv, true); rawAdd(m, D.imp, iv, m.temp); m.pur[p] = 1; log(m, `${r2(iv)} ед. ${esc(p)} → ${esc(D.imp)}`, 'warn'); }
    }
  }

  log(m, `FermiChem «${esc(x.n)}» завершена: ${r2(st_.reacted)} ед.`, 'fermi');

}

// ===== Компонент plumbing =====
function canGiveInDir(m, dir, r) { // filter/can_give_in_direction
  if (dir === S) return !m.left.includes(r) && !m.right.includes(r);
  if (dir === W) return m.right.includes(r);
  if (dir === E) return m.left.includes(r);
  return false;
}
function canGive(s, amount, reagent) {
  const m = s.m;
  if (amount <= 0) return false;
  const base = reagent ? (m.reag[reagent] || 0) > 0 : total(m) > 0;
  if (!base) return false;
  switch (m.type) {
    case 'acclimator': case 'reaction_chamber': return m.emptying;
    case 'filter': return reagent ? canGiveInDir(m, origDir(m, s.dir), reagent) : true;
    case 'splitter': {
      const dir = origDir(m, s.dir);
      if (dir === S && m.turnStraight && m.straight <= amount) { m.turnStraight = false; return true; }
      if (dir === E && !m.turnStraight && m.side <= amount) { m.turnStraight = true; return true; }
      return false;
    }
  }
  return true;
}
function transferTo(s, target, amount, reagent) {
  const m = s.m;
  if (m.type === 'filter') {
    if (reagent) return transId(m, target, reagent, amount);
    const dir = origDir(m, s.dir);
    for (const r of Object.keys(m.reag)) {
      if (!canGiveInDir(m, dir, r)) continue;
      const vol = m.reag[r] || 0;
      let next; if (vol < amount) next = amount - vol; // поведение оригинала сохранено
      transId(m, target, r, amount);
      amount = next;
      if (amount === undefined || amount <= 0) break;
    }
    return;
  }
  if (m.type === 'splitter') {
    const dir = origDir(m, s.dir);
    if (dir === S) amount = Math.min(amount, m.straight);
    if (dir === E) amount = Math.min(amount, m.side);
  }
  return reagent ? transId(m, target, reagent, amount) : transTo(m, target, amount);
}
function processRequest(m, amount, reagent, dir) {
  const net = m.ports[dir]; if (!net) return;
  const valid = net.suppliers.filter(s => s.m !== m && canGive(s, amount, reagent));
  for (const s of valid) transferTo(s, m, amount / valid.length, reagent);
}
function sendRequest(m, dir) {
  if (m.type !== 'reaction_chamber') return processRequest(m, MACHINE_REAGENT_TRANSFER, null, dir);
  const req = Object.entries(m.required);
  if (m.emptying || !req.length) return;
  for (const [r, need] of req) {
    const have = m.reag[r] || 0;
    if (have > 0) {
      if (have < need) { processRequest(m, Math.min(need - have, MACHINE_REAGENT_TRANSFER), r, dir); return; }
    } else { processRequest(m, Math.min(need, MACHINE_REAGENT_TRANSFER), r, dir); return; }
  }

}
function plumbingProcess(m) {
  if (!m._dem || !Object.keys(m.ports).length) return;

  if (total(m) < m.maxVol) for (const d of CARD) if (d & m._dem) sendRequest(m, d);

// ===== process() машин =====
function machineProcess(m) {
  switch (m.type) {
    case 'synthesizer':

      addReag(m, m.reagent, m.amount, 300); return;
    case 'acclimator': {
      const t = total(m);
      if (!m.enabled || t <= EPS || m.temp === m.target) { m.state = 'Neutral'; if (t <= EPS) m.emptying = false; return; }
      m.state = m.temp < m.target ? 'Heating' : 'Cooling';
      if (!m.emptying) {
        if (m.temp >= m.target && m.target + m.diff >= m.temp) m.emptying = true;
        if (m.temp <= m.target && m.target - m.diff <= m.temp) m.emptying = true;
      }
      // adjust_thermal_energy((target - T) * heater_coefficient * SPECIFIC_HEAT_DEFAULT * total_volume)
      m.temp = Math.max(2.7, Math.min(1000, m.temp + (m.target - m.temp) * 0.1 * 200 * t / heatCap(m)));
      handleReactions(m);

    }
    case 'disposer': if (total(m) > EPS) m.destroyed += removeAmount(m, 10, false); return;
    case 'pill_press':
      if (total(m) >= m.volume - EPS) { removeAmount(m, m.volume); m.made[m.product]++; } return;
    case 'bottler':
      if (m.containers && total(m) >= m.wanted - EPS) { removeAmount(m, m.wanted); m.filled++; } return;
    case 'liquid_pump': if (m.geyser) addReag(m, m.geyser, 2, 300); return;
  }

function stepSim() {
  for (let s = 0; s < 2; s++) for (const m of st.machines) if (m.fermi) fermiProcess(m); // SSprocessing, 1 с

  for (const m of st.machines) plumbingProcess(m);  // SSfluids
  st.tick++;

}
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// ===== Редактирование =====
function placeDuct(x, y) {
  if (!inBounds(x, y)) return false;
  if (machineAt(x, y)) { flash('Трубу нельзя проложить под машиной'); return false; }
  const k = dkey(x, y, ductLayer);

}
function placeMachine(type, x, y) {

  for (const d of ductsAt(x, y)) st.ducts.delete(dkey(x, y, d.layer)); // plumbing/enable() сносит трубы под собой

}
function eraseAt(x, y) {

  const ds = ductsAt(x, y);
  if (!ds.length) return false;
  const own = ds.find(d => d.layer === ductLayer);
  const victim = tool === 'duct' && own ? [own] : ds;

}
function rotateMachine(m, cw = true) {

}
function changed(full = true) { rebuild(); if (full) renderInspector(); else updateDynamic(); draw(); save(); }

// ===== Холст =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const view = { ox: 40, oy: 40, scale: 1.4 };
const TS = 32;
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function fitView() {
  const r = cv.parentElement.getBoundingClientRect();
  if (!r.width || !r.height) return;
  view.scale =Math.max(0.3, Math.min(3, Math.min((r.width - 40) / (st.w * TS), (r.height - 40) / (st.h * TS))));
  view.ox = (r.width - st.w * TS * view.scale) / 2; view.oy = (r.height - st.h * TS * view.scale) / 2;
}
const toTile = (px, py) => [Math.floor((px - view.ox) / (TS * view.scale)), Math.floor((py - view.oy) / (TS * view.scale))];

function reagColor(name) {
  if (CHEM && CHEM.R[name] && /^#[0-9a-f]{3,8}$/i.test(CHEM.R[name].c)) return CHEM.R[name].c;
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h},65%,58%)`;
}
function draw() {
  const r = cv.parentElement.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.save();
  ctx.translate(view.ox, view.oy);
  const s = TS * view.scale;
  // пол
  ctx.fillStyle = '#2a2e35'; ctx.fillRect(0, 0, st.w * s, st.h * s);
  ctx.strokeStyle = '#1c1f24'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= st.w; x++) { ctx.moveTo(x * s + .5, 0); ctx.lineTo(x * s + .5, st.h * s); }
  for (let y = 0; y <= st.h; y++) { ctx.moveTo(0, y * s + .5); ctx.lineTo(st.w * s, y * s + .5); }
  ctx.stroke();
  ctx.strokeStyle = '#4a5260'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, st.w * s, st.h * s);

  // подсвечиваемая сеть
  let hiNet = null;
  const focus = hover && inBounds(...hover) ? hover : null;
  if (focus) {
    const ds = ductsAt(...focus);
    const pick = ds.find(d => d.layer === ductLayer) || ds[0];
    if (pick) hiNet = ductInfo.get(dkey(pick.x, pick.y, pick.layer))?.net;
  }

  // трубы
  for (const l of LAYERS) {
    for (const d of st.ducts.values()) {
      if (d.layer !== l) continue;
      const info = ductInfo.get(dkey(d.x, d.y, d.layer));
      const off = -LAYER_OFF[l] / TS * s; // pixel_y вверх
      const offx = LAYER_OFF[l] / TS * s;
      const cx = d.x * s + s / 2 + offx, cy = d.y * s + s / 2 + off;
      const col = PIPE_COLORS[d.color] === '#ffffff' ? '#c9ced6' : PIPE_COLORS[d.color];
      const lit = hiNet && info && info.net === hiNet;
      const segs = [];
      for (const dir of CARD) if (info && info.conn & dir) segs.push(DXY[dir]);
      const drawSegs = (w, c) => {
        ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath();
        if (!segs.length) { ctx.moveTo(cx - s * .12, cy); ctx.lineTo(cx + s * .12, cy); }
        for (const [dx, dy] of segs) { ctx.moveTo(cx, cy); ctx.lineTo(cx + dx * s / 2, cy + dy * s / 2); }
        ctx.stroke();
      };
      if (lit) drawSegs(s * .34, 'rgba(255,230,120,.45)');
      drawSegs(s * .22, '#101215');
      drawSegs(s * .14, col);
      if (!segs.length) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, s * .1, 0, 7); ctx.fill(); }
    }
  }

  // машины
  for (const m of st.machines) drawMachine(m, m.x * s, m.y * s, s, 1);

  // предпросмотр размещения
  if (focus && tool.startsWith('m:') && !machineAt(...focus)) {
    const ghost = { type: tool.slice(2), dir: placeDir, reag: {}, maxVol: 1, ports: {} };
    ghost._sup = sup(ghost); ghost._dem = dem(ghost);
    drawMachine(ghost, focus[0] * s, focus[1] * s, s, .5);
  }
  if (selected) { ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.strokeRect(selected[0] * s + 1, selected[1] * s + 1, s - 2, s - 2); }
  if (focus) { ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.strokeRect(focus[0] * s + .5, focus[1] * s + .5, s - 1, s - 1); }
  ctx.restore();
}
function drawMachine(m, x, y, s, alpha) {
  const def = DEFS[m.type];
  ctx.save(); ctx.globalAlpha = alpha;
  const pad = s * .14;
  // порты: красный — забирает (demand), синий — отдаёт (supply)
  for (const d of CARD) {
    const isS = m._sup & d, isD = m._dem & d;
    if (!isS && !isD) continue;
    const [dx, dy] = DXY[d];
    const cx = x + s / 2 + dx * (s / 2 - pad / 2), cy = y + s / 2 + dy * (s / 2 - pad / 2);
    const pw = dx ? pad : s * .3, ph = dx ? s * .3 : pad;
    const connected = m.ports && m.ports[d];
    ctx.fillStyle = isS ? '#3f86e8' : '#e0473d';
    if (!connected) ctx.globalAlpha = alpha * .45;
    ctx.fillRect(cx - pw / 2, cy - ph / 2, pw, ph);
    ctx.globalAlpha = alpha;
  }
  ctx.fillStyle = def.color;
  roundRect(x + pad, y + pad, s - pad * 2, s - pad * 2, s * .08); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  // состояние
  if (m.type === 'acclimator' && m.state && m.state !== 'Neutral') {
    ctx.fillStyle = m.state === 'Heating' ? 'rgba(255,90,40,.55)' : 'rgba(80,170,255,.55)';
    roundRect(x + pad, y + pad, s - pad * 2, s - pad * 2, s * .08); ctx.fill();
  }
  if ((m.type === 'acclimator' || m.type === 'reaction_chamber') && m.emptying) {
    ctx.fillStyle = '#5eea8c'; ctx.beginPath(); ctx.arc(x + s - pad - s * .09, y + pad + s * .09, s * .055, 0, 7); ctx.fill();
  }
  // заполненность
  const t = total(m);
  if (t > EPS) {
    const fw = (s - pad * 2 - 4) * Math.min(1, t / m.maxVol);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x + pad + 2, y + s - pad - s * .1, s - pad * 2 - 4, s * .07);
    ctx.fillStyle = reagColor(Object.keys(m.reag).sort((a, b) => m.reag[b] - m.reag[a])[0]);
    ctx.fillRect(x + pad + 2, y + s - pad - s * .1, fw, s * .07);
  }

  const [fx, fy] = DXY[m.dir];

  ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `600 ${Math.max(8, s * .24)}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

}

// ===== Мышь / клавиатура =====
let drag = null, spaceDown = false, spacePanned = false;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  const [x, y] = toTile(e.offsetX, e.offsetY);
  hover = [x, y];
  if (e.button === 1|| (e.button === 0 && spaceDown)) { if (spaceDown) spacePanned = true; drag ={ pan: true, sx: e.clientX, sy: e.clientY, ox: view.ox, oy: view.oy }; e.preventDefault(); return; }
  if (e.button === 2) { drag = { erase: true }; if (inBounds(x, y) && eraseAt(x, y)) changed(); return; }
  if (e.button !== 0 || !inBounds(x, y)) return;
  if (tool === 'select') { selected = [x, y]; renderInspector(); draw(); return; }
  if (tool === 'duct') { drag = { duct: true }; if (placeDuct(x, y)) changed(false); return; }
  if (tool === 'erase') { drag = { erase: true }; if (eraseAt(x, y)) changed(); return; }
  if (tool.startsWith('m:')) {
    if (placeMachine(tool.slice(2), x, y)) { selected = [x, y]; changed(); }
  }
});
addEventListener('mouseup', () => { if (drag && drag.duct) renderInspector(); drag = null; });
cv.addEventListener('mousemove', e => {
  if (drag && drag.pan) { view.ox = drag.ox + e.clientX - drag.sx; view.oy = drag.oy + e.clientY - drag.sy; draw(); return; }
  const t = toTile(e.offsetX, e.offsetY);
  const prev = hover;
  const movedTile = !hover || hover[0] !== t[0] || hover[1] !== t[1];
  hover = t;
  if (drag && movedTile && (drag.duct || drag.erase)) {
    // при быстром движении мыши проходим все промежуточные тайлы
    // (Г-образно, чтобы трубы не стыковались по диагонали)

    let [x, y] = from;

    while (y !== t[1]) { y += Math.sign(t[1] - y); path.push([x, y]); }
    if (!path.length) path.push(t);
    let any = false;
    for (const [x, y] of path) {
      if (!inBounds(x, y)) continue;
      if (drag.duct ? placeDuct(x, y) : eraseAt(x, y)) any = true;
    }
    if (any) changed(drag.erase);
  }

cv.addEventListener('wheel', e => {

  view.ox = e.offsetX - (e.offsetX - view.ox) * ns / view.scale;

}, { passive: false });
addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === 'r' || k === 'к') {
    const target = hover && machineAt(...hover);
    if (target && !tool.startsWith('m:')) { rotateMachine(target, !e.shiftKey); changed(); }
    else { const order = [N, E, S, W]; placeDir = order[(order.indexOf(placeDir) + (e.shiftKey ? 3 : 1)) % 4]; renderTools(); draw(); }
  }
  else if (k === 'v' || k === 'м' || k === 'escape') setTool('select');
  else if (k === 'd' || k === 'в') setTool('duct');
  else if (k === 'x' || k === 'ч') setTool('erase');

addEventListener('keyup', e => {

async function pool(items, n, fn) {

  await Promise.all(Array.from({ length: n }, async () => { while (q.length) { await fn(q.shift()); done++; } }));

// Минимальный читатель zip: центральный каталог (в т.ч. ZIP64), stored/deflate.
// Читает только нужные записи, весь архив в память не грузится.
async function readZip(file, wanted, onProgress) {
  const size = file.size, buf = async (a, b) => new DataView(await file.slice(a, b).arrayBuffer());
  const tailLen = Math.min(size, 65557 + 20);
  const tail = await buf(size - tailLen, size);
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('это не zip-архив');

    const loc = eocd - 20;
    if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('повреждённый ZIP64');
    const z64 = Number(tail.getBigUint64(loc + 8, true));
    const z = await buf(z64, z64 + 56);
    if (z.getUint32(0, true) !== 0x06064b50) throw new Error('повреждённый ZIP64');
    count = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOff = Number(z.getBigUint64(48, true));
  }
  const cd = await buf(cdOff, cdOff + cdSize), dec = new TextDecoder();
  const entries = [];
  for (let i = 0, p = 0; i < count && p + 46 <= cd.byteLength; i++) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    const method = cd.getUint16(p + 10, true);
    let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true), off = cd.getUint32(p + 42, true);
    const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
    if (csize === 0xffffffff || usize === 0xffffffff || off === 0xffffffff) {
      for (let q = p + 46 + nlen, end = q + xlen; q + 4 <= end;) {
        const id = cd.getUint16(q, true), sz = cd.getUint16(q + 2, true);
        if (id === 1) {
          let r = q + 4;
          if (usize === 0xffffffff) { usize = Number(cd.getBigUint64(r, true)); r += 8; }
          if (csize === 0xffffffff) { csize = Number(cd.getBigUint64(r, true)); r += 8; }
          if (off === 0xffffffff) off = Number(cd.getBigUint64(r, true));
        }
        q += 4 + sz;
      }
    }
    p += 46 + nlen + xlen + clen;
    const rel = name.endsWith('/') ? null : wanted(name);
    if (rel) entries.push({ rel, method, csize, off });
  }
  const out = [];
  await pool(entries, 8, async (e) => {
    const lh = await buf(e.off, e.off + 30);
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const data = file.slice(start, start + e.csize);
    let text;
    if (e.method === 0) text = await data.text();
    else if (e.method === 8) text = await new Response(data.stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    else return;
    out.push({ path: e.rel, text });
    if (out.length % 20 === 0) onProgress(`Прочитано файлов: ${out.length}/${entries.length}`);
  });
  return out;
}
const relevantLocal = p => { const r = DMChem.localRelPath(p); return r && DMChem.isRelevantPath(r) ? r : null; };
document.getElementById('chemDir').onclick = () => document.getElementById('chemDirIn').click();
document.getElementById('chemZip').onclick = () => document.getElementById('chemZipIn').click();
document.getElementById('chemDirIn').onchange = async e => {
  const all = [...e.target.files]; e.target.value = '';
  if (!all.length) return;
  const root = (all[0].webkitRelativePath || all[0].name).split('/')[0];
  try {
    const items = all.map(f => ({ f, rel: relevantLocal(f.webkitRelativePath || f.name) })).filter(x => x.rel);
    const files = [];
    await pool(items, 16, async x => { files.push({ path: x.rel, text: await x.f.text() }); if (files.length % 20 === 0) chemSay(`Прочитано файлов: ${files.length}/${items.length}`); });
    applyChem(chemFromLocal(files, 'папка ' + root));
  } catch (err) { chemSay('Не удалось: ' + err.message, 'var(--red)'); }
};
document.getElementById('chemZipIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    chemSay('Читаю архив…');
    if (typeof DecompressionStream === 'undefined') throw new Error('браузер слишком старый для чтения zip (нужен Chrome/Edge 103+, Firefox 113+)');
    const files = await readZip(f, relevantLocal, t => chemSay(t));
    applyChem(chemFromLocal(files, f.name));
  } catch (err) { chemSay('Не удалось прочитать архив: ' + err.message, 'var(--red)'); }
};
function loadChem() {
  let c = null;
  try { const s = localStorage.getItem(CHEM_KEY); if (s) c = JSON.parse(s); } catch (e) {}
  if (c && c.R) { chemSource = c.meta && c.meta.source === 'local' ? 'local' : 'github'; setChem(c); } else { chemSource = 'builtin'; setChem(window.BUILTIN_CHEM); }
  let link = null; try { link = localStorage.getItem(LINK_KEY); } catch (e) {}
  document.getElementById('chemLink').value = link || (CHEM && CHEM.meta && CHEM.meta.repo ? 'https://github.com/' + CHEM.meta.repo : DEFAULT_LINK);
  chemInfo();
}
document.getElementById('chemUpdate').onclick = async () => {
  const status = document.getElementById('chemStatus'), btn = document.getElementById('chemUpdate');
  const say = (t, c) => { status.innerHTML = `<span style="color:${c || 'var(--muted)'}">${esc(t)}</span>`; };
  if (!window.DMChem) return say('Парсер не встроен — откройте собранный Химзавод.html.', 'var(--warn)');
  const link = document.getElementById('chemLink').value.trim() || DEFAULT_LINK;
  const opts = DMChem.parseRepoLink(link);
  if (!opts) return say('Не понял ссылку. Нужна вида https://github.com/владелец/репозиторий (можно с /tree/ветка).', 'var(--warn)');
  btn.disabled = true;
  try {
    const full = await DMChem.fetchFromGitHub(t => say(t), opts);
    applyChem(DMChem.slimForFactory(full), link);
  } catch (e) {
    say('Не удалось обновить: ' + e.message + '. Нужен интернет и доступ к github.com.', 'var(--red)');
  } finally { btn.disabled = false; }
};
document.getElementById('chemReset').onclick = () => {
  try { localStorage.removeItem(CHEM_KEY); localStorage.removeItem(LINK_KEY); } catch (e) {}
  loadChem(); renderInspector();
  document.getElementById('chemStatus').textContent = window.BUILTIN_CHEM ? 'Возвращена встроенная база.' : '';
};

// ===== Старт =====
loadChem();
try { const s = localStorage.getItem(SAVE_KEY); if (s) load(JSON.parse(s)); } catch (e) {}
renderTools(); rebuild(); renderInspector();
let fitted = false;
new ResizeObserver(() => {
  if (!fitted && cv.parentElement.clientWidth > 0) { fitView(); fitted = true; }
  resize();
}).observe(cv.parentElement);
</script>
