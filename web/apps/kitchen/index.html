<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueMoon Кухня и Бар</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --panel2: #f0ede7; --line: #ddd8cf;
  --text: #22201c; --muted: #6f6a61; --accent: #b4561f; --accent2: #2f6f8f;
  --ok: #2e7d4f; --warn: #a8741a; --bad: #b23b3b; --chip: #ebe6dd;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1d2026; --panel2: #23272e; --line: #333842;
    --text: #e6e3dc; --muted: #9a968d; --accent: #e8894a; --accent2: #6cb6d9;
    --ok: #5cc28a; --warn: #e0b04f; --bad: #e57373; --chip: #2a2f37;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1d2026; --panel2: #23272e; --line: #333842;
  --text: #e6e3dc; --muted: #9a968d; --accent: #e8894a; --accent2: #6cb6d9;
  --ok: #5cc28a; --warn: #e0b04f; --bad: #e57373; --chip: #2a2f37;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
a { color: var(--accent2); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
header h1 span { color: var(--muted); font-weight: 400; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--panel2); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.spacer { flex: 1; }
.meta { color: var(--muted); font-size: 12px; }
.iconbtn { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.on { display: flex; }
.side { width: 340px; min-width: 280px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
.side .controls { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; user-select: none; }
.chip.on { background: var(--accent2); color: #fff; }
.list { overflow-y: auto; flex: 1; }
.row { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.row:hover { background: var(--panel2); }
.row.sel { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.25); }
.count { color: var(--muted); font-size: 12px; padding: 4px 12px; }
.detail { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
.detail h2 { margin: 0 0 4px; font-size: 22px; }
.detail h3 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.desc { color: var(--muted); margin: 4px 0 0; }
.badges { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.b { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.b.soda { background: rgba(108,182,217,.18); color: var(--accent2); }
.b.booze { background: rgba(232,137,74,.18); color: var(--accent); }
.b.up { background: rgba(224,176,79,.18); color: var(--warn); }
.b.emag { background: rgba(229,115,115,.18); color: var(--bad); }
.b.mix { background: rgba(92,194,138,.18); color: var(--ok); }
.b.plant { background: rgba(92,194,138,.12); color: var(--ok); }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { padding: 4px 0; }
.ing .ing { margin-left: 18px; border-left: 2px solid var(--line); padding-left: 10px; }
.amt { display: inline-block; min-width: 52px; font-variant-numeric: tabular-nums; font-weight: 600; }
.cat-note { color: var(--muted); font-size: 12px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: inline; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
.how { margin: 2px 0 4px; }
.method { margin: 6px 0 2px 18px; }
.method-t { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.kv div:nth-child(odd) { color: var(--muted); }
.bar-meter { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; width: 200px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.bar-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad)); }
.scale { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.scale input { width: 80px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { background: var(--chip); padding: 2px 9px; border-radius: 6px; font-size: 13px; }
.links a.can { box-shadow: inset 0 0 0 1px var(--ok); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.stock { border-bottom: 1px solid var(--line); }
.stock > summary { display: block; padding: 8px 12px; font-size: 13px; color: var(--text); font-weight: 600; }
.stock-body { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.stock-body label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.stock-grp { font-size: 12px; color: var(--muted); margin-top: 4px; }
.extra-list { display: flex; flex-wrap: wrap; gap: 4px; }
.extra-list span { background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
.extra-list span b { cursor: pointer; margin-left: 4px; color: var(--bad); font-weight: 400; }
.sugg { position: relative; }
.sugg-box { position: absolute; z-index: 5; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.sugg-box div { padding: 4px 10px; cursor: pointer; font-size: 13px; }
.sugg-box div:hover { background: var(--panel2); }
.subtabs { display: flex; gap: 4px; }
.subtabs .chip { font-size: 13px; padding: 4px 12px; }
table.t { border-collapse: collapse; width: 100%; }
table.t td, table.t th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
.miss { color: var(--warn); font-size: 12px; }
.src { color: var(--muted); font-size: 12px; }
.src a { color: var(--muted); text-decoration: underline dotted; }
.star { border: 1px solid var(--line); background: var(--panel2); color: var(--muted); border-radius: 8px; padding: 2px 10px; cursor: pointer; font-size: 14px; margin-left: 10px; vertical-align: middle; }
.star.on { color: #f2b632; border-color: #f2b632; }
.row .fav { color: #f2b632; font-size: 12px; }
.grp { padding: 8px 12px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
@media (max-width: 760px) {
  main { flex-direction: column; }
  .view.on { flex-direction: column; }
  .side { width: auto; min-width: 0; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>BlueMoon <span>· кухня и бар</span></h1>
  <div class="tabs">
    <button class="tab" data-tab="cook">🍳 Повар</button>
    <button class="tab" data-tab="bar">🍸 Бармен</button>
    <button class="tab" data-tab="fav">★ Избранное <span id="fav-n"></span></button>
  </div>
  <div class="spacer"></div>
  <div class="meta" id="meta"></div>
  <button class="iconbtn" id="theme" title="Тема">◐</button>
</header>
<main>
  <section class="view" id="view-cook">
    <aside class="side">
      <div class="controls">
        <div class="subtabs" id="cook-modes">
          <span class="chip on" data-mode="recipes">Рецепты</span>
          <span class="chip" data-mode="process">Обработка</span>
          <span class="chip" data-mode="mixes">Смеси</span>
        </div>
        <input class="search" id="cook-q" placeholder="Поиск блюда…">
        <input class="search" id="cook-ing" placeholder="Есть ингредиент… (напр. tomato)">
        <div class="chips" id="cook-cats"></div>
      </div>
      <div class="count" id="cook-count"></div>
      <div class="list" id="cook-list"></div>
    </aside>
    <div class="detail" id="cook-detail"></div>
  </section>

  <section class="view" id="view-bar">
    <aside class="side">
      <details class="stock" id="stock">
        <summary>🧰 Мой бар — что есть в наличии</summary>
        <div class="stock-body" id="stock-body"></div>
      </details>
      <div class="controls">
        <input class="search" id="bar-q" placeholder="Поиск напитка или ингредиента…">
        <div class="chips" id="bar-filters"></div>
      </div>
      <div class="count" id="bar-count"></div>
      <div class="list" id="bar-list"></div>
    </aside>
    <div class="detail" id="bar-detail"></div>
  </section>

  <section class="view" id="view-fav">
    <aside class="side">
      <div class="controls">
        <input class="search" id="fav-q" placeholder="Поиск в избранном…">
      </div>
      <div class="list" id="fav-list"></div>
    </aside>
    <div class="detail" id="fav-detail"></div>
  </section>
</main>

ike yin and yang.","color":"#D8FF59","booze":30,"file":"§kreagents/alcohol_reagents.dm"},"§emalibu_sunset":{"name":"Malibu Sunset","desc":"A drink consisting of creme de coconut and tropical juices","taste":"coconut, with orange and grenadine accents","glass":"Malibu Sunset","glass_desc":"Tropical looking drinks, with ice cubes hovering on the surface and grenadine coloring the bottom.","color":"#FF9473","booze":20,"file":"§kreagents/alcohol_reagents.dm"},"§eliz_fizz":{"name":"Liz Fizz","desc":"Triple citrus layered with some ice and cream.","taste":"brain freezing sourness","glass":"Liz Fizz","glass_desc":"Looks like a citrus sherbet seperated in layers? Why would anyone want that is beyond you.","color":"#D8FF59","booze":0,"file":"§kreagents/alcohol_reagents.dm"},"§ehotlime_miami":{"name":"Hotlime Miami","desc":"The essence of the 90's, if they were a bloody mess that is.","taste":"coconut and aesthetic violence","glass":"Hotlime Miami","glass_desc":"This looks very aesthetically pleasing.","color":"#A7FAE8","booze":40,"special":true,"file":"§kreagents/alcohol_reagents.dm"},"§fmilkshake_strawberry":{"name":"Strawberry Milkshake","desc":"Frozen Strawberry Milk!","taste":"summer memories","glass":"glass of strawberry milkshake","glass_desc":"A glass of sweet, pink Strawberry Shake","color":"#F4E1EA","file":"§nreagents/chemistry/reagents/drink_reagents.dm"},"§emillie_kiss":{"name":"Millie Kiss","desc":"Cold coffee with strawberry flavor.","taste":"Purrrrifying~","glass":"glass of Millie Kiss","glass_desc":"Cold coffee with strawberry flavor.","color":"#e7aee7","booze":10,"special":true,"file":"§kreagents/alcohol_reagents.dm"},"§emauna_loa":{"name":"Mauna Loa","desc":"Extremely hot; not for the faint of heart!","taste":"fiery, with an aftertaste of burnt flesh","glass":"Mauna Loa","glass_desc":"Lavaland in a drink... mug... volcano... thing.","color":"#fe8308","booze":40,"special":true,"file":"§kreagents/alcohol_reagents.dm"},"§ecommander_and_chief":{"name":"Commander <script>
"use strict";
// данные встроены сжатыми: общие префиксы путей заменены на «§a», «§b»…, пустые поля выброшены
const D = (() => {
  const raw = JSON.parse(document.getElementById("bm-data").textContent);
  const P = raw.prefixes;
  const ex = s => s.charCodeAt(0) === 167 ? P[s.charCodeAt(1) - 97] + s.slice(2) : s;
  const walk = v => {
    if (typeof v === "string") return ex(v);
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === "object") { const o = {}; for (const k in v) o[ex(k)] = walk(v[k]); return o; }
    return v;
  };
  const d = walk(raw.data);
  for (const it of Object.values(d.items))
    for (const k of ["reagents", "bonus", "tastes", "juice", "grind"]) it[k] = it[k] || [];
  for (const r of d.reactions) { r.cat = r.cat || []; r.res = r.res || []; }
  for (const r of d.recipes) { r.tools = r.tools || []; r.sub = r.sub || ""; r.count = r.count || 1; }
  for (const s of d.seeds) s.reagents = s.reagents || [];
  return d;
})();
const R = D.reagents, I = D.items;

// ---------- helpers
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
};
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const nameOf = p => cap((R[p] || I[p] || {}).name || p.split("/").pop());
const fmt = n => { const r = Math.round(n * 10) / 10; return (Number.isInteger(r) ? r : r.toFixed(1)) + ""; };
const push = (m, k, v) => (m[k] || (m[k] = [])).push(v);
const ancestorsOf = p => { const a = []; let s = p; while (s.lastIndexOf("/") > 0) { a.push(s); s = s.slice(0, s.lastIndexOf("/")); } return a; };
const ghLink = f => `https://github.com/${D.repo}/blob/master/${f}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem("bm13:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bm13:" + k, JSON.stringify(v)); } catch {} },
};

// ---------- indices
const reactByResult = {}, reactByFood = {}, reactUsing = {};
for (const r of D.reactions) {
  r.res.forEach(([p]) => push(reactByResult, p, r));
  if (r.food) push(reactByFood, r.food, r);
  [...r.req, ...r.cat].forEach(([p]) => push(reactUsing, p, r));
}
const isDrinkReagent = p => p.startsWith("/datum/reagent/consumable");
const barReactions = D.reactions.filter(r => !r.food && r.res.some(([p]) => isDrinkReagent(p)));
const drinkSet = new Set(barReactions.flatMap(r => r.res.map(([p]) => p)).filter(isDrinkReagent));

const TIERS = [
  ["dispensable_reagents", "база", ""], ["upgrade_reagents", "улучш. 1", "up"], ["upgrade_reagents2", "улучш. 2", "up"],
  ["upgrade_reagents3", "улучш. 3", "up"], ["upgrade_reagents4", "улучш. 4", "up"], ["emagged_reagents", "емаг", "emag"],
];
const DISP = { soda: "Soda", booze: "Booze" };
const dispOf = {};
for (const [dk, d] of Object.entries(D.dispensers))
  for (const [tk, label, cls] of TIERS) (d[tk] || []).forEach(p => push(dispOf, p, { dk, tk, label, cls }));
const baseSet = new Set(Object.keys(dispOf));

const plantSrc = {};
for (const [ip, it] of Object.entries(I)) {
  it.juice.forEach(([p]) => push(plantSrc, p, { kind: "сок", item: ip }));
  it.grind.forEach(([p]) => push(plantSrc, p, { kind: "помол", item: ip }));
}
for (const s of D.seeds) s.reagents.forEach(([p]) => push(plantSrc, p, { kind: "растение", item: s.product }));

const craftByResult = {}, cookedFrom = {}, slicedFrom = {}, procFrom = {}, toolFrom = {}, seedsByProduct = {}, recipesUsing = {};
for (const rec of D.recipes) {
  push(craftByResult, rec.result, rec);
  rec.reqs.forEach(([p]) => push(recipesUsing, p, rec));
}
for (const [p, it] of Object.entries(I)) {
  if (it.cooked_type) push(cookedFrom, it.cooked_type, p);
  if (it.slice_path) push(slicedFrom, it.slice_path, p);
}
D.processor.forEach(x => push(procFrom, x.out, x));
D.processable.forEach(x => push(toolFrom, x.out, x));
D.seeds.forEach(s => push(seedsByProduct, s.product, s));

const CATS = {
  CAT_BURGER: "Бургеры", CAT_SOUP: "Супы", CAT_DONUT: "Пончики", CAT_PASTRY: "Выпечка", CAT_PIE: "Пироги",

  CAT_BREAD: "Хлеб", CAT_SALAD: "Салаты", CAT_SANDWICH: "Сэндвичи", CAT_SPAGHETTI: "Паста", CAT_PIZZA: "Пицца",
  CAT_MEXICAN: "Мексиканская", CAT_EGG: "Яйца", CAT_EAST: "Восточная",
};
const TOOLS = {
  TOOL_KNIFE: "нож", TOOL_ROLLINGPIN: "скалка", TOOL_UNROLLINGPIN: "скалка (обратно)", TOOL_WELDER: "сварка",
  TOOL_SCREWDRIVER: "отвёртка", TOOL_WIRECUTTER: "кусачки", TOOL_CROWBAR: "лом", TOOL_WRENCH: "гаечный ключ",
  TOOL_MULTITOOL: "мультитул",
};
const toolName = t => t.startsWith("/") ? nameOf(t) : (TOOLS[t] || t.replace(/^TOOL_/, "").toLowerCase());

function boozeLabel(b) {
  if (!b) return "безалкогольный";
  return b <= 10 ? "едва алкогольный" : b <= 20 ? "слабый" : b <= 30 ? "ниже среднего" : b <= 40 ? "чуть ниже среднего"
    : b <= 50 ? "средний" : b <= 60 ? "выше среднего" : b <= 70 ? "крепкий" : b <= 80 ? "очень крепкий"
    : b <= 90 ? "экстремально крепкий" : "смертельно крепкий";
}
const tempText = r => r.temp ? `${r.cold ? "охладить ниже" : "нагреть до"} ${fmt(r.temp)} K (${fmt(r.temp - 273.15)} °C)` : "";

// ---------- favorites
let favs = store.get("favs", []);
const isFav = p => favs.includes(p);
function toggleFav(p) {
  favs = isFav(p) ? favs.filter(x => x !== p) : [...favs, p];
  store.set("favs", favs);

function recalcStock() {
  haveRaw = new Set(stock.extra);
  for (const [dk, d] of Object.entries(D.dispensers))
    for (const [tk] of TIERS) if (stock[dk] && stock[dk][tk]) (d[tk] || []).forEach(p => haveRaw.add(p));
  canMake = new Set(haveRaw);
  let changed = true;
  while (changed) {
    changed = false;
    for (const r of D.reactions) {
      if (r.food) continue;
      if (r.res.every(([p]) => canMake.has(p))) continue;
      if ([...r.req, ...r.cat].every(([p]) => canMake.has(p))) { r.res.forEach(([p]) => canMake.add(p)); changed = true; }
    }
  }
}
function missingFor(p) {
  // одна реакция, где не хватает ровно одного ингредиента
  let best = null;
  for (const r of reactByResult[p] || []) {
    const miss = [...r.req, ...r.cat].map(([q]) => q).filter(q => !canMake.has(q));
    if (miss.length && (!best || miss.length < best.length)) best = miss;
  }
  return best;
}

  for (const p of rows) {
    const rec = (craftByResult[p] || [])[0];
    list.append(el("div", { class: "row" + (sel.cook === p ? " sel" : ""), onclick: () => go("cook", p) },
      el("span", { class: "nm" }, rec ? cap(rec.name) : nameOf(p)), favMark(p),
      rec && !cookCat ? el("span", { class: "sub" }, CATS[rec.sub] || "") : null));
  }
  if (!rows.length) list.append(el("div", { class: "empty" }, "Ничего не найдено"));
}
function processTable(kind) {
  const t = el("table", { class: "t" });
  const rows = [];
  if (kind === "micro") for (const [p, it] of Object.entries(I)) { if (it.cooked_type) rows.push([p, it.cooked_type, ""]); }
  if (kind === "slice") for (const [p, it] of Object.entries(I)) { if (it.slice_path) rows.push([p, it.slice_path, `×${it.slices_num || "?"}`]); }
  if (kind === "tool") D.processable.forEach(x => rows.push([x.in, x.out, toolName(x.tool) + (x.n > 1 ? ` ×${x.n}` : "")]));
  if (kind === "proc") D.processor.forEach(x => rows.push([x.in, x.out, (x.slime ? "слайм-процессор " : "") + (x.mult > 1 ? `×${x.mult}` : "")]));
  rows.sort((a, b) => nameOf(a[0]).localeCompare(nameOf(b[0])));
  t.append(el("tr", {}, el("th", {}, "Что кладёшь"), el("th", {}, "Что получаешь"), el("th", {}, "")));
  rows.forEach(([a, b, n]) => t.append(el("tr", {}, el("td", {}, itemLink(a)), el("td", {}, itemLink(b)), el("td", { class: "src" }, n))));
  return t;
}
function renderCookDetail(box = $("#cook-detail"), p = sel.cook) {
  box.innerHTML = "";
  if (p && p.startsWith("@")) {
    const titles = { micro: "Микроволновка: что во что превращается", slice: "Нарезка ножом", tool: "Скалка и инструменты", proc: "Кухонный комбайн (processor)" };
    box.append(el("h2", {}, titles[p.slice(1)] || ""), el("div", { class: "card", style: "margin-top:12px" }, processTable(p.slice(1))));
    return;
  }
  if (!p || !I[p]) { box.append(cookHome()); return; }
  const it = I[p];
  box.append(el("h2", {}, nameOf(p), starBtn(p)));
  if (it.desc) box.append(el("p", { class: "desc" }, it.desc));
  const kv = el("div", { class: "kv" });
  if (it.tastes.length) kv.append(el("div", {}, "Вкус"), el("div", {}, it.tastes.join(", ")));
  const nut = [...it.reagents, ...it.bonus];
  if (nut.length) {
    const sum = {}; nut.forEach(([q, a]) => sum[q] = (sum[q] || 0) + a);
    kv.append(el("div", {}, "Содержит"), el("div", {}, ...Object.entries(sum).flatMap(([q, a], i) => [i ? ", " : "", reagentLink(q), ` ${fmt(a)}u`])));
  }
  if (it.cooked_type) kv.append(el("div", {}, "В микроволновке"), el("div", {}, "→ ", itemLink(it.cooked_type)));
  if (it.slice_path) kv.append(el("div", {}, "Нарезается"), el("div", {}, `→ ${it.slices_num || "?"}× `, itemLink(it.slice_path)));
  D.processable.filter(x => x.in === p).forEach(x => kv.append(el("div", {}, cap(toolName(x.tool))), el("div", {}, "→ ", itemLink(x.out))));
  D.processor.filter(x => x.in === p).forEach(x => kv.append(el("div", {}, "В комбайне"), el("div", {}, "→ ", itemLink(x.out))));
  if (it.juice.length) kv.append(el("div", {}, "Сок"), el("div", {}, ...it.juice.flatMap(([q], i) => [i ? ", " : "", reagentLink(q)])));
  if (it.grind.length) kv.append(el("div", {}, "Помол"), el("div", {}, ...it.grind.flatMap(([q], i) => [i ? ", " : "", reagentLink(q)])));
  if (kv.childNodes.length) box.append(el("div", { class: "card", style: "margin-top:12px" }, kv));

  const srcs = itemSources(p);
  box.append(el("h3", {}, "Как приготовить"));
  if (!srcs.length) box.append(el("div", { class: "card" }, itemHint(p) ? `Источник: ${itemHint(p)}` : "Рецепта нет: берётся готовым (раздатчик, вендомат, карго, ботаника и т. п.)"));
  srcs.forEach(s => {
    const card = el("div", { class: "card" }, methodBlock(s, 1, new Set([p])));
    card.querySelectorAll(":scope > .method > .ing > li > details.item-how").forEach(d => { d.open = true; d.dispatchEvent(new Event("toggle")); });
    if (s.kind === "craft") card.append(el("div", { class: "src", style: "margin-left:18px" }, `«${cap(s.rec.name)}» · код: `, srcLink(s.rec.file)));
    if (s.kind === "mix") card.append(el("div", { class: "src", style: "margin-left:18px" }, "смешать в ёмкости · код: ", srcLink(s.r.file)));
    box.append(card);
  });

  const anc = ancestorsOf(p);
  const used = D.recipes.filter(r => r.reqs.some(([q]) => anc.includes(q))).map(r => r.result).filter((q, i, a) => a.indexOf(q) === i);
  if (used.length) {
    box.append(el("h3", {}, `Используется в рецептах (${used.length})`));
    box.append(el("div", { class: "links" }, used.sort((a, b) => nameOf(a).localeCompare(nameOf(b))).map(itemLink)));
  }
}
function cookHome() {
  return el("div", {},
    el("h2", {}, "Повар"),
    el("p", { class: "desc" }, `${D.recipes.length} рецептов из кода BlueMoon. Выбери блюдо слева: увидишь ингредиенты и как получить каждый из них (раскрывается до муки, мяса и овощей). Поле «Есть ингредиент» ищет блюда по продукту, который у тебя есть.`),
    el("div", { class: "card" },
      el("b", {}, "Базовые заготовки"),
      el("div", { class: "links", style: "margin-top:8px" },
        ["dough", "flatdough", "doughslice", "bun", "cakebatter", "piedough", "pastrybase", "meat/steak/plain", "meat/rawcutlet", "meat/cutlet", "cheesewedge", "boiledegg", "spaghetti", "boiledspaghetti", "tortilla"]
          .map(s => "/obj/item/reagent_containers/food/snacks/" + s).filter(q => I[q]).map(itemLink))));
}
document.querySelectorAll("#cook-modes .chip").forEach(c => c.onclick = () => {
  cookMode = c.dataset.mode;
  document.querySelectorAll("#cook-modes .chip").forEach(x => x.classList.toggle("on", x === c));
  renderCookCats(); renderCookList();
});
$("#cook-q").oninput = e => { cookQ = e.target.value.trim(); renderCookList(); };
$("#cook-ing").oninput = e => { cookIng = e.target.value.trim(); renderCookList(); };

// =====================================================================
// FAVORITES
// =====================================================================
let favQ = "";
function renderFavList() {
  const list = $("#fav-list"); list.innerHTML = "";
  const q = favQ.toLowerCase();
  const match = p => (R[p] || I[p]) && (!q || nameOf(p).toLowerCase().includes(q));
  const byName = (a, b) => nameOf(a).localeCompare(nameOf(b));
  const food = favs.filter(p => I[p] && match(p)).sort(byName);
  const drinks = favs.filter(p => R[p] && match(p)).sort(byName);
  const row = p => el("div", { class: "row" + (sel.fav === p ? " sel" : ""), onclick: () => go("fav", p) },
    R[p] ? el("span", { class: "dot", style: `background:${R[p].color || "#888"}` }) : null,
    el("span", { class: "nm" }, nameOf(p)),
    R[p] && canMake.has(p) ? el("span", { class: "sub", style: "color:var(--ok)", title: "можно сделать" }, "✔") : null,
    el("span", { class: "sub", title: "убрать из избранного", style: "cursor:pointer", onclick: e => { e.stopPropagation(); toggleFav(p); } }, "✕"));
  if (food.length) { list.append(el("div", { class: "grp" }, `🍳 Блюда (${food.length})`)); food.forEach(p => list.append(row(p))); }
  if (drinks.length) { list.append(el("div", { class: "grp" }, `🍸 Напитки (${drinks.length})`)); drinks.forEach(p => list.append(row(p))); }
  if (!food.length && !drinks.length) list.append(el("div", { class: "empty" }, favs.length ? "Ничего не найдено" : "Пока пусто"));
}
function renderFavDetail() {
  const box = $("#fav-detail");
  const p = sel.fav;
  if (p && isFav(p) && R[p]) return renderBarDetail(box, p);
  if (p && isFav(p) && I[p]) return renderCookDetail(box, p);
  box.innerHTML = "";
  box.append(el("h2", {}, "Избранное"),
    el("p", { class: "desc" }, favs.length
      ? "Выбери рецепт слева."
      : "Нажми «☆ в избранное» рядом с названием блюда или напитка, и он появится здесь. Список сохраняется в этом браузере."));
}
$("#fav-q").oninput = e => { favQ = e.target.value.trim(); renderFavList(); };

// ---------- theme & init
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get("theme", ""));
$("#theme").onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#15171b";
  const t = dark ? "light" : "dark"; applyTheme(t); store.set("theme", t);
};
$("#meta").textContent = `данные: ${D.repo.split("/").pop()} · ${D.built}`;
recalcStock(); renderStock(); renderBarFilters(); renderCookCats();
window.addEventListener("hashchange", route);
if (!location.hash) location.hash = store.get("tab", "cook"); else route();
</script>
