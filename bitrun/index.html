<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Битран</title>
<style>
/* Битран (битраннинг): виртуальные домены, квантовый сервер, нетподы, награды, вендор NexaCache, глитчи.
   Вёрстка как у Карго. Данные — из code/modules/bitrunning BlueMoon-Station. */
:root{
  --bg:#e9ebee; --panel:#ffffff; --panel2:#f3f4f7; --fg:#171a21; --muted:#5a6273; --faint:#8b92a1; --line:#d4d8df; --line2:#bcc2cc;
  --accent:#a83fb8; --accent-fg:#ffffff; --navy:#1d3766;
  --ok:#2e8a4b; --warn:#b07a0e; --bad:#c0262d; --peace:#2f8fb8; --pink:#c0398f; --gold:#a8790e;
  --font-b:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-m:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#d27ee0; --accent-fg:#26082b; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; --peace:#5cb8e0; --pink:#ef6fbd; --gold:#e6c05a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#d27ee0; --accent-fg:#26082b; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; --peace:#5cb8e0; --pink:#ef6fbd; --gold:#e6c05a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);padding:0 16px 48px}
.wrap{max-width:1280px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:.03em}
.brand h1{font-size:19px;line-height:1;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.card{overflow:hidden}
.card>h3{margin:0;padding:12px 16px;font-size:15.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 12%,var(--panel));border-bottom:1px solid var(--line);display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .body{padding:10px 16px 14px;font-size:14px}
.card .body p{margin:0 0 8px}
.card .body p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:12px 16px;display:grid;gap:8px;font-size:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font:12px var(--font-m);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,var(--accent)) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--kc,var(--accent)) 45%,var(--panel))}
.bul{margin:0;padding:10px 16px 12px 34px;font-size:14px;display:grid;gap:5px}
.note{margin:0 16px 14px;padding:9px 12px;border-radius:8px;font-size:13.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 9%,var(--panel));border-left:3px solid var(--kc,var(--accent))}
.note.bad{--kc:var(--bad)} .note.ok{--kc:var(--ok)} .note.warn{--kc:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{font-weight:600;background:var(--panel2);font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;padding:10px 16px 14px}
kbd{font:12px var(--font-m);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;white-space:nowrap}
code{font:12.5px var(--font-m);background:var(--panel2);border-radius:4px;padding:0 4px}
.wide{grid-column:1/-1}

/* калькулятор */
.calc{padding:14px 16px;display:grid;gap:12px}
.ctl{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.ctl label{display:inline-flex;gap:8px;align-items:center}
.ctl select,.ctl input[type=number]{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:13.5px}
.ctl select{max-width:100%}
.ctl input[type=number]{width:64px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2)}
.kpi b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.mul{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.mul span{border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--panel2);font-variant-numeric:tabular-nums}

/* фильтры и домены */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:13px;min-width:0;flex:1 1 180px;max-width:280px}
.dif{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent);white-space:nowrap}
.dif0{--dc:var(--peace)} .dif1{--dc:var(--warn)} .dif2{--dc:#d9682a} .dif3{--dc:var(--bad)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:8px 16px 0}
.stat{margin-left:auto;display:inline-flex;gap:10px;font:12.5px var(--font-m);color:var(--muted);white-space:nowrap}
.stat .c{color:var(--pink)} .stat .r{color:var(--gold)}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;padding:10px 16px 14px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.quote{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--panel2);font-size:13.5px;color:var(--muted);font-style:italic}
.empty{padding:30px;text-align:center;color:var(--muted)}
.foot{margin-top:26px;font-size:12.5px;color:var(--faint);max-width:90ch}

@media (max-width:560px){
  .brand small{display:none} nav{margin-left:0;width:100%} nav button{flex:1;padding:7px 6px}
  .dl{grid-template-columns:minmax(0,1fr)} .dl dt{margin-top:4px}
}
/* В компактном окне Пульта */
.pult-compact body{padding:0 10px 40px}
.pult-compact header{padding:8px 0 6px;gap:8px}
.pult-compact .brand small{display:none}
.pult-compact nav{margin-left:0;width:100%}
.pult-compact nav{flex-wrap:wrap}
.pult-compact nav button{flex:1 1 auto;padding:5px 8px}
.pult-compact .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pult-compact .grid{grid-template-columns:minmax(0,1fr)}
.pult-compact .card>h3,.pult-compact .card .body,.pult-compact .steps,.pult-compact .calc,.pult-compact .tbl,.pult-compact .dl,.pult-compact .tags{padding-left:10px;padding-right:10px}
.pult-compact .bul{padding-left:28px;padding-right:10px}
.pult-compact .note,.pult-compact .quote{margin-left:10px;margin-right:10px}
.pult-compact .dl{grid-template-columns:minmax(0,1fr)}
.pult-compact .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.pult-compact .foot{display:none}

/* Мини-викторина Пульта */
.pq{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:16px 18px;display:grid;gap:12px;max-width:900px;margin-bottom:14px}
.pq-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.pq-h b{font-size:17px}.pq-h span{font-size:12.5px;color:var(--muted)}
.pq-q{font-size:16px;font-weight:600;line-height:1.45}
.pq-pre{font-size:14px;line-height:1.5;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0}
.pq-o{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.pq-o button{text-align:left;border:1px solid var(--line2,var(--line));background:var(--panel2);border-radius:9px;padding:9px 12px;cursor:pointer;font:inherit;font-size:14px;color:inherit}
.pq-o button:hover:not(:disabled){border-color:var(--accent)}
.pq-o button.right{background:color-mix(in srgb,var(--ok,#2e8a4b) 20%,var(--panel));border-color:var(--ok,#2e8a4b)}
.pq-o button.wrong{background:color-mix(in srgb,var(--bad,#c0262d) 18%,var(--panel));border-color:var(--bad,#c0262d)}
.pq-o button:disabled{cursor:default}
.pq-r{font-size:14px;padding:9px 12px;border-radius:8px;border-left:3px solid var(--ok,#2e8a4b);background:color-mix(in srgb,var(--ok,#2e8a4b) 9%,var(--panel))}
.pq-r.bad{border-left-color:var(--bad,#c0262d);background:color-mix(in srgb,var(--bad,#c0262d) 9%,var(--panel))}
.pq-n{justify-self:start;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg,#fff);border-radius:9px;padding:6px 14px;font-weight:600;cursor:pointer;font:inherit}
.pult-compact .pq{padding:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="badge">БИТ</div><div><h1>Битран</h1><small>Виртуальные домены, награды, оборудование</small></div></div>
  <nav role="tablist">
    <button role="tab" id="tab-basics" data-tab="basics" aria-selected="true">Основы</button>
    <button role="tab" id="tab-domains" data-tab="domains" aria-selected="false">Домены</button>
    <button role="tab" id="tab-rewards" data-tab="rewards" aria-selected="false">Награды</button>
    <button role="tab" id="tab-gear" data-tab="gear" aria-selected="false">Оборудование</button>
    <button role="tab" id="tab-threats" data-tab="threats" aria-selected="false">Угрозы</button>
    <button role="tab" id="tab-quiz" data-tab="quiz" aria-selected="false">Тренажёр</button>
  </nav>
</header>

<main>
<section id="v-basics"></section>
<section id="v-domains" hidden>
  <div class="tools"><div class="chips" id="difchips"></div><input class="search" id="q" type="search" placeholder="Поиск домена…" autocomplete="off"></div>
  <div id="domlist"></div>
</section>
<section id="v-rewards" hidden></section>
<section id="v-gear" hidden></section>
<section id="v-threats" hidden></section>
<section id="v-quiz" hidden></section>

<p class="foot">Неофициальный помощник по коду BlueMoon-Station (модуль <code>code/modules/bitrunning</code>, карты <code>_maps/virtual_domains</code>). Цифры — из кода; на сервере что-то могли поменять. В спорном случае спроси администрацию (F1).</p>
</main>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY='bitrun.state';
const fmt=(n,d=2)=>{const r=Math.round(n*10**d)/10**d;return r.toLocaleString('ru-RU',{maximumFractionDigits:d})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const card=(title,body,c,cls='')=>`<div class="panel card ${cls}" style="--kc:${c||'var(--accent)'}"><h3>${title}</h3>${body}</div>`;
const steps=a=>`<ol class="steps">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;
const bul=a=>`<ul class="bul">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const body=a=>`<div class="body">${(Array.isArray(a)?a:[a]).map(x=>`<p>${x}</p>`).join('')}</div>`;
const note=(t,cls='')=>`<div class="note ${cls}">${t}</div>`;
const tbl=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th${h[0]==='#'?' class="n"':''}>${h.replace(/^#/,'')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${head[i][0]==='#'?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const C={srv:'#a83fb8',pod:'#4f8fe0',safe:'#3fa66b',exit:'#2f8fb8',bad:'#c0393f',gold:'#c9a227',ven:'#d9a03a',glitch:'#d63c45',disk:'#5b7be0'};

/* ===================== ДАННЫЕ ===================== */
// Сложность: 0 — мирный (синий), 1 — лёгкий (жёлтый), 2 — средний (оранжевый), 3 — сложный (красный).
const DIF=[['Мирный','угроза только от игроков-призраков'],['Лёгкий','слабые мобы, их легко обойти'],['Средний','мобы стреляют или агрессивны'],['Сложный','домен создан, чтобы убить битраннера']];
const OUT={
  miner:'Шахтёр (форма шахтёра)',clown:'Клоун',sec:'Офицер СБ',bitductor:'«Битдуктор»: комбинезон абдуктора, митенки, берцы',
  heretic:'Еретик: чёрная форма, берцы, стетоскоп; ты во фракции еретиков и не можешь телепортироваться',
  echo:'Эхолокатор: повязка на глаза (ты слепой), трейт «Эхолокация», плащ, гарнитура',
  beach:'Пляжный боец: джинсы, сандалии, случайная пушка с двумя магазинами в карманах (пистолет, болтовка, мини-Узи, Дезерт Игл, ракетница или винтовка)',
  ice:'Альпинист: серая форма, зимняя куртка и ботинки, вещмешок, факел',
  solfed:'Морпех SolFed: форма, берцы, боевые перчатки, балаклава, рюкзак СБ, ID'
};
// rew — очки награды домена (BITRUNNER_REWARD_*), cost — очки сервера на загрузку
const DOMS=[
 {id:'beach_bar',en:'Beach Bar',ru:'Пляжный бар',cost:0,rew:1,dif:0,nonohit:1,
  desc:'Весёлый прибрежный рай, где дружелюбные бармены подают напитки.',
  how:['Пей напитки, которые лежат на полу и столах бара с самого начала: каждые 20 u выпитого — 1 очко цели, нужно 10. Это 200 u, то есть четыре полных стакана по 50 u.','Когда наберёшь 10 очков, зашифрованный ящик появится на месте «таинственной ауры» — неси его на площадку в сейфхаусе.','Считаются только напитки, которые стояли на карте при загрузке. Налитое заново не засчитывается.','Роли барменов и спасателя в коде есть, но домен не зовёт призраков, поэтому их спавнеры удаляются при загрузке.'],
  mobs:'Крабы, курица',loot:'Пляжный мяч'},
 {id:'breeze_bay',en:'Breeze Bay',ru:'Бухта Бриз',cost:0,rew:3,dif:0,nonohit:1,
  desc:'Прибрежный городок, к северу от которого раскинулся большой лес.',
  how:['Возьми удочку с карты и поймай любую рыбу: каждый улов — 10 очков цели, то есть хватает одной поклёвки.','Ящик появляется на месте «таинственной ауры». Не дай крабам себя покусать.','Лучший домен для старта: бесплатный, а награда 3, как у лёгких.'],
  mobs:'Краб',loot:'—',tip:'Рыбалка — в приложении «Рыбалка» Пульта.'},
 {id:'gondola_asteroid',en:'Gondola Asteroid',ru:'Астероид гондол',cost:0,rew:1,dif:0,nonohit:1,
  desc:'Астероид, на котором растёт обильный лес гондол. Безмятежно.',
  how:['Ящик стоит в середине карты. По подсказке его «не сдвинуть», но в этой версии у него обычное сопротивление — по коду его можно просто тащить.','Способ из подсказки: съесть мясо гондолы (в нём Advanced Tranquility) и самому стать гондолой — гондолы двигают что угодно.','Гондолы здесь — 50 HP, с них падают шкура и то самое мясо.'],
  mobs:'Гондолы',loot:'—'},
 {id:'grasslands_hunt',en:'Grasslands Hunt',ru:'Охота в степи',cost:0,rew:1,dif:0,nonohit:1,modular:1,
  desc:'Мирная охота в дикой природе.',
  how:['Убей оленей: каждый — 3,5 очка цели, нужно 10, то есть три оленя. Ящик появится на месте ауры.','На карте 3 точки, в каждой с шансом 85% появляется один олень. Если оленей меньше трёх, набрать 10 нельзя: останови домен и загрузи заново.','Олени пугливые и не атакуют.'],
  mobs:'Олени (75 HP, не бьют)',loot:'—'},
 {id:'clown_planet',en:'Clown Planet',ru:'Планета клоунов',cost:1,rew:3,dif:1,outfit:'clown',
  desc:'В глубоких тёмных просторах космоса есть только Хонк.',
  how:['Пройди фабрику, найди зашифрованный ящик и доставь его в сейфхаус.','Ящик можно отправить по трубам утилизации через приёмный жёлоб — он выедет у выхода рядом с сейфхаусом.'],
  mobs:'Клоуны',loot:'Велосипедный гудок',bounty:'Bike Horn'},
 {id:'heretic_hunt',en:'Heretical Hunt',ru:'Охота еретика',cost:1,rew:3,dif:1,outfit:'heretic',
  desc:'Предай своих товарищей, чтобы достичь высшей силы.',
  how:['Убивай «экипаж»: обычный член экипажа, врач, инженер, ассистент — 1 очко; офицер СБ, инженер в МОДе и стрелки с SMG — 2; главы (ГВ, СИ, ГСБ) — 3. Нужно 10.','Когда ритуал завершится, у руны появится ящик — дотащи его в сейфхаус на площадку.','Фальшивый экипаж ослаблен: до 60 HP и 5–8 урона. Сырые пророки — по 30 HP.'],
  mobs:'Фальшивый экипаж, стрелки NT и Синдиката, сырые пророки',loot:'—'},

function domCard(d){

  if(d.ghosts)tags.push('<span class="tag">зовёт призраков</span>');
  if(d.nonohit)tags.push('<span class="tag">без бонуса «без урона»</span>');
  if(d.nolinked)tags.push('<span class="tag">урон не переносится на тело</span>');
  if(d.sec)tags.push('<span class="tag">есть находки</span>');
  const dl=[];
  dl.push(['Экипировка',d.outfit?OUT[d.outfit]:'Твой выбор в нетподе']);

  dl.push(['В ящике награды',(d.loot&&d.loot!=='—'?d.loot+' + ':'')+'руда (см. «Награды»)']);

function calc(){
  const c=S.calc,d=DOMS.find(x=>x.id===c.dom)||DOMS[0];
  const n=Math.max(1,c.n|0),nh=Math.min(n,Math.max(0,c.nh|0)),th=Math.max(0,c.th|0),tier=Math.min(4,Math.max(1,c.tier|0));
  const rnd=!!c.rnd&&d.cost>0&&d.cost<20;
  const servo=2*tier*0.1;
  const parts=[['База',0.8]];
  if(rnd)parts.push(['Случайный',0.2]);
  parts.push(['Манипуляторы',servo]);
  if(th)parts.push(['Глитчи',2*th]);
  if(n>1)parts.push(['Мультиплеер',1.1*(n-1)]);
  if(nh&&!d.nonohit&&!d.nolinked)parts.push(['Без урона',0.8*nh]);
  const mult=parts.reduce((a,[,v])=>a+v,0);
  const base=mult+d.rew;
  const ts=TIMES[Math.min(4,Math.max(0,c.time|0))][1];
  const score=5*th+d.rew+(d.dif+1)*ts;
  const g=grade(score);
  const disk=d.dif>=2&&(g==='A'||g==='S');
  let h=`<div class="kpis">
    <div class="kpi"><b>×${fmt(mult)}</b><span>множитель ящика</span></div>
    <div class="kpi ok"><b>${(d.rew*100).toLocaleString('ru-RU')} BP</b><span>каждому битраннеру</span></div>
    <div class="kpi"><b>+${d.rew}</b><span>очков сервера (цена ${d.cost})</span></div>
    <div class="kpi ${g==='S'||g==='A'?'ok':g==='D'?'bad':''}"><b>${g}</b><span>оценка (${score} очк.)</span></div>
    <div class="kpi ${disk?'ok':''}"><b>${disk?'Да':'Нет'}</b><span>диск дизайнов</span></div>
  </div>
  <div class="mul">${parts.map(([k,v])=>`<span>${k} +${fmt(v)}</span>`).join('')}</div>`;
  if(c.rnd&&!rnd)h+=`<div class="muted" style="font-size:13px">Этот домен не выпадает случайно (бесплатный или стоит 20), бонус «случайный» не считается.</div>`;
  if(nh&&(d.nonohit||d.nolinked))h+=`<div class="muted" style="font-size:13px">В этом домене бонуса «без урона» нет.</div>`;
  const rows=ORES.filter(([,,m])=>d.rew>=m).map(([nm,k])=>[nm,Math.max(1,Math.ceil(0.5*base*k)),Math.max(1,Math.ceil(1.5*base*k))]);
  h+=tbl(['Руда','#Минимум','#Максимум'],rows.map(([a,b,x])=>[a,b,x]));
  h+=`<div class="muted" style="font-size:12.5px">Плюс в ящике: ${d.loot&&d.loot!=='—'?esc(d.loot):'предметов домена нет'}. Руда — штуки руды, их надо переплавить в ПРМ.</div>`;
  $('#c-out').innerHTML=h;
}

    'Шанс при каждой загрузке домена: <b>угроза × 0,2</b>, но не меньше <b>5%</b> и не больше <b>15%</b>. Угроза сервера растёт на очки оценки после каждой сдачи ящика. Глитч нужен ещё и призрак, который согласится.',
    'Каждый глитч даёт <b>+2</b> к множителю ящика и <b>+5</b> к очкам оценки — опасно, но выгодно.',
    'Случайное событие «глитч» обходит мирные домены, но шанс при загрузке действует везде, где есть мобы без игрока (даже крабы).']),C.glitch);
  h+=card('Роли',tbl(['Роль','#Угроза от','Что умеет'],[
    ['<b>Cyber Police</b>','0','Человек в чёрном костюме и очках, владеет боевым искусством «Спящий карп».'],
    ['<b>Cyber Tac</b>','50','Человек в бронежилете и шлеме SWAT, с пистолетом.'],
    ['<b>Netguardian Prime</b>','90','Боевой робот: 500 HP, 45–65 урона вблизи, очереди по 6 пуль, раз в 30 с с шансом 35% — залп из трёх ракет 84 мм.']])+
    note('Роль выбирается случайно из доступных по угрозе. После выбора угроза уменьшается на половину порога роли.'),C.glitch);
  h+=card('Взлом сервера емагом',bul([
    'Шанс глитча удваивается (угроза × 0,4), потолок — 30% вместо 15%.',
    'Глитч, который доберётся до площадки приёма в сейфхаусе, после короткого сканирования <b>телепортируется на станцию</b> через байтфордж: здоровье 200–500, полное лечение.',
    'Если байтфордж сломан или обесточен, глитч на станции замедляется. Сломать байтфордж — первый ответ СБ.',
    'Мобы домена при взломе «прозревают» и получают сообщение о свободе.',
    'Взлом — действие антагониста. Битраннеру без роли антагониста ломать свой сервер нельзя.']),C.bad);
  h+=card('Как не умереть',bul([
    'Помни: урон аватара бьёт по твоему телу. Следи за монитором хоста на поясе.',
    'Перед сложными доменами бери диски: аптечки в рюкзаке мало. Диски работают на каждом входе.',
    'Не останавливай домен, пока внутри коллеги: у них 20 секунд, и потом урон мозга.',
    'Не закрывай чужой нетпод и не таскай его тело — это аварийное отключение.',
    'Бросить домен можно: выйди по лестнице и останови его с консоли. Цена не вернётся.',
    'Если в отсеке нет байтфорджа в 4 клетках от сервера, сданный ящик никуда не придёт — проверь заранее.']),C.safe);
  h+='</div>';
  $('#v-threats').innerHTML=h;
}

/* ===================== ОБЩЕЕ ===================== */
const S0={tab:'basics',dom:'all',calc:{dom:'breeze_bay',n:1,nh:1,th:0,tier:1,time:2,rnd:false}};
const S=(()=>{let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  s=Object.assign({},S0,s&&typeof s==='object'?s:{});
  s.calc=Object.assign({},S0.calc,s.calc||{});
  if(!DOMS.some(d=>d.id===s.calc.dom))s.calc.dom=S0.calc.dom;
  return s})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}


/* --- Мини-викторина Пульта (одинаковая во всех модулях): серия, рекорд, достижение за серию 5 --- */
const pqAward=id=>{try{const g=window.parent!==window&&parent.PultGame;g&&g.award(id)}catch(e){}};
const PQ={};
function pqMake(key,gen,ach,rerender){
  let best=0;try{best=+(localStorage.getItem('pq.'+key)||0)}catch(e){}
  PQ[key]={x:null,pick:null,ok:0,n:0,streak:0,best,gen,ach,rerender};
}
function pqHtml(key,title){
  const Q=PQ[key];if(!Q.x){Q.x=Q.gen();Q.pick=null}
  const x=Q.x,done=Q.pick!==null,right=done&&x.opts[Q.pick].ok;
  return `<div class="pq"><div class="pq-h"><b>${title}</b><span>${Q.n?`верно ${Q.ok} из ${Q.n} · серия ${Q.streak} · рекорд ${Q.best}`:'серия из 5 верных — достижение 🏆'}</span></div>
    ${x.pre||''}<div class="pq-q">${x.q}</div>
    <div class="pq-o">${x.opts.map((o,i)=>`<button type="button" data-pq="${key}" data-i="${i}" class="${done?(o.ok?'right':(i===Q.pick?'wrong':'')):''}" ${done?'disabled':''}>${o.h}</button>`).join('')}</div>
    ${done?`<div class="pq-r ${right?'ok':'bad'}"><b>${right?'Верно!':'Нет.'}</b> ${x.ex||''}</div><button type="button" class="pq-n" data-pqn="${key}">Дальше →</button>`:''}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pq]');
  if(b){const Q=PQ[b.dataset.pq];if(!Q||Q.pick!==null)return;Q.pick=+b.dataset.i;Q.n++;
    if(Q.x.opts[Q.pick].ok){Q.ok++;Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;try{localStorage.setItem('pq.'+b.dataset.pq,Q.best)}catch(e){}}if(Q.streak>=5&&Q.ach)pqAward(Q.ach)}else Q.streak=0;
    Q.rerender();return}
  const n=e.target.closest('[data-pqn]');if(n){const Q=PQ[n.dataset.pqn];Q.x=Q.gen();Q.pick=null;Q.rerender()}
});
const pqPick=(arr,n,not)=>{const a=arr.filter(x=>!not||!not(x)).slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};
const pqShuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

pqMake('dom',()=>{
  const d=DOMS[Math.floor(Math.random()*DOMS.length)],t=Math.floor(Math.random()*2);
  const o=pqShuffle([d,...pqPick(DOMS,3,x=>x.id===d.id)]);
  if(t===0)return{pre:`<div class="pq-pre">${esc(d.desc)}${d.mobs?`<br><span style="opacity:.75">Враги: ${esc(d.mobs)}</span>`:''}</div>`,q:'Какой это домен?',opts:o.map(x=>({h:esc(x.ru),ok:x===d})),ex:`«${esc(d.ru)}» (${esc(d.en)}): вход ${d.cost} BP, награда ×${d.rew}.`};
  const c=[...new Set(DOMS.map(x=>x.cost))];const oc=pqShuffle([d.cost,...pqPick(c,3,v=>v===d.cost)]);
  return{q:`Сколько BP стоит загрузить домен «${esc(d.ru)}»?`,opts:oc.map(v=>({h:v+' BP',ok:v===d.cost})),ex:`«${esc(d.ru)}»: ${d.cost} BP, награда ×${d.rew}.`};
},'bitrun.quiz',()=>renderBitQuiz());
function renderBitQuiz(){$('#v-quiz').innerHTML=pqHtml('dom','Тренажёр битраннера: домены')}

const TABS=['basics','domains','rewards','gear','threats','quiz'];
const RENDER={basics:renderBasics,domains:renderDomains,rewards:renderRewards,gear:renderGear,threats:renderThreats,quiz:renderBitQuiz};
const done={};
function go(t){
  if(!TABS.includes(t))t='basics';
  S.tab=t;
  TABS.forEach(x=>{$('#v-'+x).hidden=x!==t;$('#tab-'+x).setAttribute('aria-selected',x===t)});
  if(!done[t]||t==='domains'){RENDER[t]();done[t]=1}
  save();try{history.replaceState(null,'','#'+t)}catch(e){}
  window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
const h0=(location.hash||'').slice(1);
go(TABS.includes(h0)?h0:S.tab);
window.addEventListener('hashchange',()=>{const t=(location.hash||'').slice(1);if(TABS.includes(t)&&t!==S.tab)go(t)});
</script>
