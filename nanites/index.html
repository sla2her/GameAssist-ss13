<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наниты</title>
<style>
/* Наниты: каталог программ (расход, триггеры, доп. настройки, сбои, исследование), сборка набора с балансом
   нанитов и шпаргалкой кодов, основы работы с оборудованием, дерево исследований, НРП. Вёрстка как у Вирусологии. */
:root{
  --bg:#e9ebee; --panel:#ffffff; --panel2:#f3f4f7; --fg:#171a21; --muted:#5a6273; --faint:#8b92a1; --line:#d4d8df; --line2:#bcc2cc;
  --accent:#6a7fe0; --accent-fg:#0b1233; --navy:#1d3766;
  --ok:#2e8a4b; --warn:#b07a0e; --bad:#c0262d;
  --font-b:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-m:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#8b9cf0; --accent-fg:#0b1233; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#8b9cf0; --accent-fg:#0b1233; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);padding:0 16px 48px}
.wrap{max-width:1280px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:.03em}
.brand h1{font-size:19px;line-height:1;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
main{padding-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}

.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.subnav{margin-bottom:14px;display:inline-flex}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.card{overflow:hidden}
.card>h3{margin:0;padding:12px 16px;font-size:15.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 12%,var(--panel));border-bottom:1px solid var(--line);display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .body{padding:10px 16px 14px;font-size:14px}
.card .body p{margin:0 0 8px}
.card .body p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:12px 16px;display:grid;gap:8px;font-size:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font:12px var(--font-m);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,var(--accent)) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--kc,var(--accent)) 45%,var(--panel))}
.bul{margin:0;padding:10px 16px 12px 34px;font-size:14px;display:grid;gap:5px}
.note{margin:0 16px 14px;padding:9px 12px;border-radius:8px;font-size:13.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 9%,var(--panel));border-left:3px solid var(--kc,var(--accent))}
.note.bad{--kc:var(--bad)} .note.ok{--kc:var(--ok)} .note.warn{--kc:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{font-weight:600;background:var(--panel2);font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;padding:10px 16px 14px}
kbd{font:12px var(--font-m);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;white-space:nowrap}
code{font:12.5px var(--font-m);background:var(--panel2);border-radius:4px;padding:0 4px}
.wide{grid-column:1/-1}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px 16px 0}
.kpis:last-child{padding-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2)}
.kpi b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.pos{color:var(--ok);font-variant-numeric:tabular-nums} .neg{color:var(--bad);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;color:var(--dc,var(--muted));background:color-mix(in srgb,var(--dc,var(--muted)) 14%,transparent);white-space:nowrap}
.foot{margin-top:26px;font-size:12.5px;color:var(--faint);max-width:90ch;overflow-wrap:anywhere}

/* Каталог */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1 1 260px;min-width:0;padding:7px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
.tools .cntline{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.st{font-size:12.5px;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:2px 8px;white-space:nowrap}
.st b{font-variant-numeric:tabular-nums}
.st.neg b{color:var(--ok)} .st.t{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.fx{margin:0 16px 10px;font-size:13.5px;padding:8px 11px;border-radius:8px;background:var(--panel2)}
.fx b{font-weight:600}
.sets{margin:0 16px 10px}
.sets table{font-size:12.5px}
.sets td:first-child{white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.lnk{border:0;background:none;padding:0;color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.add{margin-left:auto;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-radius:8px;padding:4px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.add.on{background:var(--accent);color:var(--accent-fg)}
.card.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.opts{display:flex;flex-wrap:wrap;gap:3px}
.opts code{font-size:11.5px}

/* Сборка */
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.bad{color:var(--bad)}
.inst{border-top:1px solid var(--line)}
.inst:first-child{border-top:0}
.inst>.hd{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.inst>.hd .nm{font-weight:600}
.inst>.hd .nm small{font-weight:400;color:var(--muted);margin-left:6px}
.inst>.hd .sp{flex:1}
.inst>.hd button{border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:2px 9px;cursor:pointer;font-size:12.5px}
.inst .ed{padding:4px 16px 12px;display:grid;gap:10px}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.fl label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.fl input,.fl select{padding:4px 7px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--fg);min-width:0;font-size:13.5px}
.fl label.w2{grid-column:span 2}
.sub{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rule{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.rule select,.rule input{padding:3px 6px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);font-size:13px}
.rule input{width:70px}
.warns{margin:0;padding:10px 16px 12px 34px;display:grid;gap:5px;font-size:13.5px}
.warns li.bad{color:var(--bad)} .warns li.warn{color:var(--warn)} .warns li.ok{color:var(--ok)}
textarea.sheet{width:100%;min-height:220px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);font:12.5px/1.45 var(--font-m);resize:vertical}
.presets{display:grid;gap:8px;padding:10px 16px 14px}
.preset{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel2);display:grid;gap:4px}
.preset .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.preset .hd b{font-size:14px}
.preset .hd .sp{flex:1}
.preset p{margin:0;font-size:13px;color:var(--muted)}
.pick{position:relative}
.pick input{width:100%;padding:7px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
.pick ul{position:absolute;left:0;right:0;top:100%;z-index:4;margin:4px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line2);border-radius:9px;max-height:300px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.pick li button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.pick li button:hover,.pick li button:focus{background:var(--panel2)}
.pick li small{color:var(--muted);margin-left:6px}
.empty{padding:14px 16px;color:var(--muted);font-size:14px}

/* Исследования */
.tree{display:grid;gap:10px}
.node .pre{font-size:12.5px;color:var(--muted)}
.prog-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 12px}
.prog-chips button{border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:2px 9px;font-size:12.5px;cursor:pointer}

.nrp .it{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:6px 16px;border-top:1px solid var(--line);font-size:13.5px}
.nrp .it .n{font:12px var(--font-m);color:var(--muted)}
.nrphd{padding:8px 16px 4px;font-weight:600;font-size:13px}

@media (max-width:560px){
  .brand small{display:none} nav{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none} nav button{flex:1;padding:7px 6px}
}
/* В компактном окне Пульта */
.pult-compact body{padding:0 10px 40px}
.pult-compact header{padding:8px 0 6px;gap:8px}
.pult-compact .brand small{display:none}
.pult-compact nav{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none}
.pult-compact nav button{flex:1;padding:5px 6px}
.pult-compact .subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pult-compact .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pult-compact .grid{grid-template-columns:minmax(0,1fr)}
.pult-compact .card>h3,.pult-compact .card .body,.pult-compact .steps,.pult-compact .tbl,.pult-compact .kpis,.pult-compact .stats,.pult-compact .meta,.pult-compact .inst>.hd,.pult-compact .inst .ed,.pult-compact .presets,.pult-compact .prog-chips{padding-left:10px;padding-right:10px}
.pult-compact .bul,.pult-compact .warns{padding-left:28px;padding-right:10px}
.pult-compact .note,.pult-compact .fx,.pult-compact .sets{margin-left:10px;margin-right:10px}
.pult-compact .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.pult-compact .foot{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="badge">НАН</div><div><h1>Наниты</h1><small>Программы · Сборка и коды · Основы · Исследования · НРП</small></div></div>
  <nav role="tablist">
    <button role="tab" id="tab-progs" data-tab="progs" aria-selected="true">Программы</button>
    <button role="tab" id="tab-build" data-tab="build" aria-selected="false">Сборка<span class="cnt" id="bcnt" hidden></span></button>
    <button role="tab" id="tab-basics" data-tab="basics" aria-selected="false">Основы</button>
    <button role="tab" id="tab-research" data-tab="research" aria-selected="false">Исследования</button>
    <button role="tab" id="tab-nrp" data-tab="nrp" aria-selected="false">НРП</button>
  </nav>
</header>

<main>
<section id="v-progs">
  <div class="tools"><input type="search" id="q" placeholder="Поиск: название, описание, настройка…" autocomplete="off"><span class="cntline" id="qcnt"></span></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="flags"></div>
  <div class="grid" id="plist"></div>
</section>

<section id="v-build" hidden>
  <div class="grid" id="build"></div>
</section>

<section id="v-basics" hidden>
  <div class="seg subnav" data-subs="basics"></div>
  <div id="basics-gear"></div>
  <div id="basics-how" hidden></div>
  <div id="basics-codes" hidden></div>
  <div id="basics-errors" hidden></div>
</section>

<section id="v-research" hidden><div id="research"></div></section>
<section id="v-nrp" hidden><div id="nrp"></div></section>

<p class="foot" id="foot"></p>
</main>
</div>

<script src="data.js"></script>
<script src="../avd/nrp.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY='nanites.state';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(title,body,c,cls='',attrs='')=>`<div class="panel card ${cls}" style="--kc:${c||'var(--accent)'}" ${attrs}><h3>${title}</h3>${body}</div>`;
const steps=a=>`<ol class="steps">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;
const bul=a=>`<ul class="bul">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const body=a=>`<div class="body">${(Array.isArray(a)?a:[a]).map(x=>`<p>${x}</p>`).join('')}</div>`;
const note=(t,cls='')=>`<div class="note ${cls}">${t}</div>`;
const tbl=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th${h[0]==='#'?' class="n"':''}>${h.replace(/^#/,'')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${head[i][0]==='#'?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fmt=n=>{if(n==null||n==='')return '—';const r=Math.round(n*100)/100;return String(r).replace('.',',').replace('-','−')};
const fsec=s=>{s=Math.round(s);if(!isFinite(s))return '∞';if(s<60)return s+' с';const m=Math.floor(s/60),r=s%60;if(m<60)return m+' мин'+(r?' '+r+' с':'');return Math.floor(m/60)+' ч '+(m%60)+' мин'};

const D=window.NANITE_DATA||{programs:[],nodes:[],node_names:{},rev:{},limits:{}};
const P=D.programs;
const byId=Object.fromEntries(P.map(p=>[p.id,p]));
const nodeById=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const MAXP=D.limits.max_programs||20;
const REGEN=D.limits.regen||0.5, BASEMAX=D.limits.max||500, SAFETY=D.limits.safety||25;

/* ===================== СЛОВАРИ ===================== */
const CAT={
  'Utility Nanites':['Утилиты','#5b7be0'],
  'Medical Nanites':['Медицина','#2e9a5e'],
  'Augmentation Nanites':['Усиление','#2fb5a5'],
  'Sensor Nanites':['Датчики','#c08a3e'],
  'Protocols_Nanites':['Протоколы','#8c6ad8'],
  'Suppression Nanites':['Подавление','#d0802a'],
  'Weaponized Nanites':['Боевые','#c0393f'],
  'Defective Nanites':['Сбойные','#7d8595'],
};
const catOf=p=>CAT[p.cat]||['Прочее','#7d8595'];

// Русские названия (в игре программы подписаны по-английски, описания — по-русски)
const RU={
  dermal_button:'Кожная кнопка',research:'Распределённые вычисления',emp:'Электромагнитный резонанс','lockout/antiviral':'Улучшенная коррекция ошибок',
  self_scan:'Самосканирование','lockout/hostile_lockdown':'Враждебная блокировка',spreading:'Инфекционная экзолокомоция',metabolic_synthesis:'Метаболический синтез',
  mitosis:'Митоз',monitoring:'Мониторинг',nanite_sting:'Нанитное жало',researchplus:'Нейросеть',reduced_diagnostics:'Урезанная диагностика',relay:'Ретранслятор',
  'sensor/relay_repeat':'Повторитель на канал ретрансляции','sensor/repeat':'Повторитель сигнала',stealth:'Скрытность',signaler:'Сигнальщик',access:'Подкожная ID-карта',viral:'Вирусная реплика',
  regenerative:'Ускоренная регенерация',regenerative_advanced:'Биореконструкция',purging:'Очистка крови',blood_restoring:'Восстановление крови',defib:'Дефибрилляция',
  hard_reboot:'Протокол жёсткой перезагрузки',repairing:'Механический ремонт',brain_heal:'Нейрорегенерация',brain_heal_advanced:'Нейровосстановление',
  purging_synth:'Очистка от коррозии',heal_wounds:'Заживление ран',purging_advanced:'Избирательная очистка крови',temperature:'Регуляция температуры',
  adrenaline:'Выброс адреналина',hardening:'Укрепление кожи',refractive:'Преломляющая поверхность',conductive:'Электропроводность',mindshield:'Ментальный барьер',
  nervous:'Поддержка нервов',coagulating:'Быстрая коагуляция',
  'sensor/crit':'Датчик критического состояния','sensor/damage':'Датчик урона','sensor/death':'Датчик смерти','sensor/health':'Датчик здоровья',
  'sensor/nanite_volume':'Датчик объёма нанитов','sensor/voice':'Голосовой датчик',
  'protocol/offline':'Протокол «Затмение»','protocol/factory':'Протокол «Фабрика»','protocol/free_range':'Протокол «Свободный выгул»','protocol/hive':'Протокол «Улей»',

let replaceArmed=0;
function confirmReplace(){ // без модальных окон: второе нажатие в течение 4 с подтверждает замену
  const now=Date.now();if(now-replaceArmed<4000){replaceArmed=0;return true}

function calc(){
  const B=S.build.map(b=>({b,p:byId[b.id]}));
  let max=BASEMAX;const storage=B.filter(x=>x.p.proto==='sto'&&x.b.on),rep=B.filter(x=>x.p.proto==='rep'&&x.b.on);
  // Работает один протокол класса: первый активный по порядку
  if(storage[0])max=Math.max(1,max+(FX[storage[0].p.id].max||0));
  let use=0,useAlways=0,bonusAlways=0,bonusCond=[];
  B.forEach(({b,p},i)=>{
    if(!b.on)return;
    if(p.proto&&(p.proto==='sto'?storage[0]:rep[0]).b!==b)return;
    const fx=FX[p.id]||{};
    if(p.use<0){bonusAlways+=-p.use;return}
    use+=p.use;
    if(!fx.cond&&!b.rules.length)useAlways+=p.use;
    if(fx.bonus){if(fx.note||fx.cond)bonusCond.push([ru(p),fx.bonus,fx.note||'по условию']);else bonusAlways+=fx.bonus}
    if(fx.bonusFn)bonusCond.push([ru(p),fx.bonusFn(max,max),'при полном запасе']);
  });
  const grow=REGEN+bonusAlways,net=grow-useAlways;
  return {B,max,use,useAlways,grow,net,bonusCond,storage,rep};
}
function warnings(c){
  const w=[],B=c.B;
  if(B.length>MAXP)w.push(['bad',`Программ ${B.length} — больше лимита ${MAXP}: лишние не загрузятся.`]);
  const seen={};B.forEach(({p})=>{seen[p.id]=(seen[p.id]||0)+1});
  Object.entries(seen).forEach(([id,n])=>{if(n>1&&byId[id].unique)w.push(['bad',`«${ru(byId[id])}» — уникальная программа, вторая копия заменит первую.`])});
  if(c.storage.length>1)w.push(['warn',`Протоколов хранения включено ${c.storage.length}: работает только один — «${ru(c.storage[0].p)}».`]);
  if(c.rep.length>1)w.push(['warn',`Протоколов репликации включено ${c.rep.length}: работает только один — «${ru(c.rep[0].p)}».`]);
  if(c.net<0)w.push(['warn',`Постоянный расход ${fmt(c.useAlways)}/с больше роста ${fmt(c.grow)}/с: запас тает даже у здорового носителя${c.bonusCond.length?' (без учёта переменного роста протоколов)':''}.`]);
  // Связи кодов
  const senders={},receivers={};
  const addS=(code,who)=>{if(code>0)(senders[code]=senders[code]||[]).push(who)};
  const addR=(code,who,what)=>{if(code>0)(receivers[code]=receivers[code]||[]).push([who,what])};
  B.forEach(({b,p})=>{
    const nm=ru(p);
    if('Sent Code' in b.set&&!p.id.startsWith('sensor/relay'))addS(+b.set['Sent Code'],nm);
    if('Nanite Code' in b.set)addS(+b.set['Nanite Code'],nm+' (по радио)');
    addR(+b.act,nm,'вкл');addR(+b.deact,nm,'выкл');addR(+b.kill,nm,'удалить');if(p.trig)addR(+b.trig,nm,'сработать');
    if(p.trig&&!b.trig&&!b.tt&&!p.comm)w.push(['warn',`«${nm}»: нет кода срабатывания и таймера — сработать её будет нечем.`]);
    if(p.comm&&!b.trig&&!+b.set['Comm Code']&&!b.tt)w.push(['warn',`«${nm}»: нет ни кода срабатывания, ни Comm Code.`]);
    if(p.id.startsWith('sensor/')&&'Sent Code' in b.set&&!(+b.set['Sent Code']>0))w.push(['warn',`«${nm}»: Sent Code = 0, датчик ничего не отправит.`]);
  });
  Object.entries(senders).forEach(([code,who])=>{if(!receivers[code])w.push(['warn',`Код ${code} отправляет ${who.join(', ')}, но его никто не слушает.`])});
  Object.entries(receivers).forEach(([code,rs])=>{const kill=rs.filter(r=>r[1]==='удалить');if(kill.length&&rs.length>kill.length)w.push(['bad',`Код ${code} одновременно удаляет ${kill.map(r=>r[0]).join(', ')} и управляет другими программами.`])});
  if(!w.length&&B.length)w.push(['ok','Конфликтов не видно.']);
  return {w,senders,receivers};
}

  if(r.t==='volume')return `наниты ${dir} ${r.pct}%`;
  if(r.t==='damage')return `урон ${r.dtype} ${dir} ${r.amt}`;
  return RULES[r.t][0].toLowerCase();
}

function bindBuild(){
  const root=$('#build');
  root.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    const d=t.dataset,uid=+(d.on||d.open||d.up||d.del||0);
    if(d.on){const b=instById(uid);b.on=!b.on}
    else if(d.open){const b=instById(uid);b.open=!b.open}
    else if(d.up){const i=S.build.findIndex(b=>b.uid===uid);if(i>0)[S.build[i-1],S.build[i]]=[S.build[i],S.build[i-1]]}
    else if(d.del){S.build=S.build.filter(b=>b.uid!==uid)}
    else if(d.info){gotoProg(d.info);return}
    else if(d.preset){loadPreset(+d.preset);return}
    else if(d.rdel){const b=instById(+t.closest('[data-uid]').dataset.uid);b.rules.splice(+d.rdel,1)}
    else if(d.addid){addProg(d.addid)}
    else if(t.id==='bclear'){if(!confirmReplace())return;S.build=[]}
    else if(t.id==='bcopy'){const ta=$('#sheet');copy(ta.value,t);return}
    else return;
    save();updCnt();renderBuild();
  });
  root.addEventListener('change',e=>{
    const t=e.target,ed=t.closest('[data-uid]');if(!ed)return;
    const b=instById(+ed.dataset.uid),p=byId[b.id];
    if(t.dataset.f){b[t.dataset.f]=Math.max(0,Math.round(+t.value||0))}
    else if(t.dataset.set!=null){const s=p.set.find(x=>x.name===t.dataset.set);
      b.set[s.name]=s.type==='number'?Math.min(s.max,Math.max(s.min,+t.value||0)):(s.type==='boolean'?t.value==='1':t.value)}
    else if(t.dataset.r!=null){const r=b.rules[+t.dataset.r],k=t.dataset.rk;r[k]=k==='above'?t.value==='1':(k==='dtype'?t.value:+t.value||0)}
    else if(t.hasAttribute('data-radd')){if(t.value)b.rules.push(Object.assign({t:t.value},RULES[t.value][1]))}
    else if(t.hasAttribute('data-all')){b.all=t.value==='1'}
    else return;
    save();renderBuild();
  });
  root.addEventListener('input',e=>{
    if(e.target.id!=='bq')return;
    const q=e.target.value.trim().toLowerCase(),ul=$('#bopts');
    if(!q){ul.hidden=true;return}
    const m=P.filter(p=>p.group!=='rogue'&&(p.name.toLowerCase().includes(q)||ru(p).toLowerCase().includes(q))).slice(0,12);
    ul.innerHTML=m.map(p=>`<li><button data-addid="${p.id}">${esc(ru(p))}<small>${esc(p.name)} · ${catOf(p)[0]}</small></button></li>`).join('')||'<li class="empty">Нет такой</li>';
    ul.hidden=false;
  });
}
function copy(text,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Скопировано';setTimeout(()=>{btn.textContent=o},1500)};
  try{navigator.clipboard.writeText(text).then(done,()=>{fallback()})}catch(e){fallback()}
  function fallback(){const ta=$('#sheet');ta.select();try{document.execCommand('copy');done()}catch(e){}}
}

  el.innerHTML='<div class="grid">'+(out.join('')||card('Пунктов о нанитах нет',body('В текущей редакции НРП наниты не упоминаются.')))+
    card('Коротко',bul([
      'Эксперименты на экипаже — только в ОИР и с письменного согласия и отказа от претензий (оформите в Папирусе).',
      'Публичная камера и раздача нанитов вне отдела — только с письменного одобрения Директора ОИР или Капитана.',
      'Боевые и подавляющие программы на чужом носителе без согласия — это уже Космический закон (Терминал Брига).',
    ]),'var(--warn)')+'</div>';
}

/* ===================== НАВИГАЦИЯ ===================== */
const TABS=['progs','build','basics','research','nrp'];
const SUBS={basics:[['gear','Оборудование'],['how','Как работают'],['codes','Коды и правила'],['errors','Сбои и защита']]};
const RENDER={progs:renderProgs,build:renderBuild,basics:{gear:renderGear,how:renderHow,codes:renderCodes,errors:renderErrors},research:renderResearch,nrp:renderNrp};
const subSeg=t=>{const el=document.querySelector(`[data-subs="${t}"]`);el.innerHTML=SUBS[t].map(([id,n])=>`<button type="button" data-sub="${id}" aria-pressed="${S.sub[t]===id}">${n}</button>`).join('')};
function go(t,sub){
  if(SUBS[t]){if(sub)S.sub[t]=sub;if(!SUBS[t].some(([id])=>id===S.sub[t]))S.sub[t]=SUBS[t][0][0]}
  S.tab=t;
  TABS.forEach(x=>{$('#v-'+x).hidden=x!==t;$('#tab-'+x).setAttribute('aria-selected',x===t)});
  if(SUBS[t]){subSeg(t);SUBS[t].forEach(([id])=>{$('#'+t+'-'+id).hidden=id!==S.sub[t]});RENDER[t][S.sub[t]]();setHash(t+'/'+S.sub[t])}
  else{RENDER[t]();setHash(t)}
  save();window.scrollTo(0,0)}
function setHash(h){try{history.replaceState(null,'','#'+h)}catch(e){}}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
document.querySelectorAll('[data-subs]').forEach(el=>el.addEventListener('click',e=>{const b=e.target.closest('[data-sub]');if(b)go(el.dataset.subs,b.dataset.sub)}));
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');if(g){gotoProg(g.dataset.goto);return}
  const n=e.target.closest('[data-node]');if(n){gotoNode(n.dataset.node);return}
});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){S.cat=b.dataset.cat;save();renderProgs()}});
$('#flags').addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(b){const k=b.dataset.fl;S.fl=S.fl.includes(k)?S.fl.filter(x=>x!==k):S.fl.concat(k);save();renderProgs()}});
$('#q').addEventListener('input',e=>{S.q=e.target.value;save();renderProgs()});
$('#plist').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;addProg(b.dataset.add);
  const cnt=inBuild(b.dataset.add);b.classList.add('on');b.textContent='В сборке'+(cnt>1?' ×'+cnt:'')+' · ещё'});
bindBuild();
$('#q').value=S.q||'';
$('#foot').innerHTML=`Неофициальный помощник по коду BlueMoon-Station${D.rev.commit?` (<code>${esc(D.rev.commit)}</code> от ${esc(D.rev.date)})`:''}: <code>code/modules/research/nanites</code> (программы, машины, правила), <code>code/datums/components/nanites.dm</code> (запас и сбои), <code>code/modules/research/techweb/nodes/nanites_nodes.dm</code>, модульные правки <code>modular_sand</code> и <code>modular_splurt</code>. Названия программ и настроек — как в игре, по-английски. Код на сервере может отличаться от репозитория.`;
updCnt();
const [h0,h1]=(location.hash||'').slice(1).split(/[\/-]/);
if(TABS.includes(h0))go(h0,SUBS[h0]&&SUBS[h0].some(([id])=>id===h1)?h1:null);
else go(TABS.includes(S.tab)?S.tab:'progs');
</script>
</body>
</html>
