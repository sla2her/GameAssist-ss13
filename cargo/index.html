<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карго</title>
<style>
/* Карго: майнеры (БС-майнер и криптомайнер), шахта (гайд, автомат, фауна Лаваленда), ивенты карго-шаттла.
   Вёрстка как у Панели Командования. */
:root{
  --bg:#e9ebee; --panel:#ffffff; --panel2:#f3f4f7; --fg:#171a21; --muted:#5a6273; --faint:#8b92a1; --line:#d4d8df; --line2:#bcc2cc;
  --accent:#a8702a; --accent-fg:#ffffff; --navy:#1d3766;
  --ok:#2e8a4b; --warn:#b07a0e; --bad:#c0262d;
  --font-b:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-m:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#e0a356; --accent-fg:#241503; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --fg:#e4e7ed; --muted:#9ba3b3; --faint:#6e7687; --line:#2b3039; --line2:#3c434f;
  --accent:#e0a356; --accent-fg:#241503; --navy:#8eafee;
  --ok:#52c47a; --warn:#e6b54a; --bad:#ef5560; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-b);padding:0 16px 48px}
.wrap{max-width:1280px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px 20px;flex-wrap:wrap;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:11.5px;letter-spacing:.03em}
.brand h1{font-size:19px;line-height:1;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav{display:flex;gap:4px;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
nav button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding-top:14px}
.single nav{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}

.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.subnav{margin-bottom:14px;display:inline-flex}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.card{overflow:hidden}
.card>h3{margin:0;padding:12px 16px;font-size:15.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 12%,var(--panel));border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.card .body{padding:10px 16px 14px;font-size:14px}
.card .body p{margin:0 0 8px}
.card .body p:last-child{margin-bottom:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:12px 16px;display:grid;gap:8px;font-size:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font:12px var(--font-m);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,var(--accent)) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--kc,var(--accent)) 45%,var(--panel))}
.bul{margin:0;padding:10px 16px 12px 34px;font-size:14px;display:grid;gap:5px}
.note{margin:0 16px 14px;padding:9px 12px;border-radius:8px;font-size:13.5px;background:color-mix(in srgb,var(--kc,var(--accent)) 9%,var(--panel));border-left:3px solid var(--kc,var(--accent))}
.note.bad{--kc:var(--bad)} .note.ok{--kc:var(--ok)}
.src{font:11.5px var(--font-m);color:var(--faint)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{font-weight:600;background:var(--panel2);font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;padding:10px 16px 14px}
kbd{font:12px var(--font-m);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;white-space:nowrap}
code{font:12.5px var(--font-m);background:var(--panel2);border-radius:4px;padding:0 4px}
.wide{grid-column:1/-1}

/* калькулятор */
.calc{padding:14px 16px;display:grid;gap:12px}
.ctl{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.ctl label{display:inline-flex;gap:8px;align-items:center}
.ctl select,.ctl input[type=number]{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:13.5px}
.ctl input[type=number]{width:72px}
.ctl input[type=range]{accent-color:var(--accent);width:160px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2)}
.kpi b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.phase{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);font-size:11.5px;font-weight:600}
.phase i{display:grid;place-items:center;font-style:normal;color:#fff;white-space:nowrap;overflow:hidden}
.ph1{background:#5c9e5f} .ph2{background:#d39a2a} .ph3{background:#c0393f}

/* фильтры */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.danger{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent);white-space:nowrap}
.d1{--dc:var(--ok)} .d2{--dc:var(--warn)} .d3{--dc:var(--bad)}
.mob{display:grid;gap:0}
.mob .row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.mob .row:first-child{border-top:0}
.mob .hd{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap}
.mob .hd b{font-size:14.5px}
.mob .hd small{color:var(--faint);font:12px var(--font-m)}
.mob .st{font-size:12.5px;color:var(--muted)}
.ev{border-top:4px solid var(--kc)}
.foot{margin-top:26px;font-size:12.5px;color:var(--faint);max-width:90ch}

@media (max-width:560px){
  .brand small{display:none} nav{margin-left:0;width:100%} nav button{flex:1;padding:7px 6px}
}
/* В компактном окне Пульта */
.pult-compact body{padding:0 10px 40px}
.pult-compact header{padding:8px 0 6px;gap:8px}
.pult-compact .brand small{display:none}
.pult-compact nav{margin-left:0;width:100%}
.pult-compact nav button{flex:1;padding:5px 6px}
.pult-compact .subnav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pult-compact .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pult-compact .grid{grid-template-columns:minmax(0,1fr)}
.pult-compact .card>h3,.pult-compact .card .body,.pult-compact .steps,.pult-compact .calc,.pult-compact .tbl,.pult-compact .mob .row{padding-left:10px;padding-right:10px}
.pult-compact .bul{padding-left:28px;padding-right:10px}
.pult-compact .note{margin-left:10px;margin-right:10px}
.pult-compact .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.pult-compact .foot{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="badge" id="badge">КАР</div><div><h1 id="ttl">Карго</h1><small id="rev">Майнеры · Шахта · Ивенты шаттла</small></div></div>
  <nav role="tablist">
    <button role="tab" id="tab-miners" data-tab="miners" aria-selected="true">Майнеры</button>
    <button role="tab" id="tab-mine" data-tab="mine" aria-selected="false">Шахта</button>
    <button role="tab" id="tab-events" data-tab="events" aria-selected="false">Ивенты шаттла</button>
  </nav>
</header>

<main>
<section id="v-miners">
  <div class="seg subnav" data-subs="miners"></div>
  <div id="miners-bsm"></div>
  <div id="miners-calc" hidden></div>
  <div id="miners-crypto" hidden></div>
  <div id="miners-law" hidden></div>
</section>

<section id="v-mine" hidden>
  <div class="seg subnav" data-subs="mine"></div>
  <div id="mine-guide"></div>
  <div id="mine-shop" hidden></div>
  <div id="mine-fauna" hidden></div>
</section>

<section id="v-events" hidden>
  <div class="seg subnav" data-subs="events"></div>
  <div id="events-loan"></div>
  <div id="events-other" hidden></div>
</section>

<p class="foot">Неофициальный помощник по коду сборки MOLOT-BlueMoon-Station (цифры — из кода и конфига <code>config/sandstorm/balance.txt</code>), НРП и Космическому закону. Конфиг на сервере может отличаться от репозитория. В спорном случае спросите администрацию (F1).</p>
</main>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
// ?only=miners|mine|events — одна часть (так её открывает Пульт: три приложения во втором круге «Карго»).
const PART=(()=>{const p=new URLSearchParams(location.search).get('only');return ['miners','mine','events'].includes(p)?p:null})();
const KEY='cargo.state'+(PART?'.'+PART:'');
const fmt=(n,d=1)=>{const r=Math.round(n*10**d)/10**d;return r.toLocaleString('ru-RU',{maximumFractionDigits:d})};

const card=(title,body,c,cls='')=>`<div class="panel card ${cls}" style="--kc:${c||'var(--accent)'}"><h3>${title}</h3>${body}</div>`;
const steps=a=>`<ol class="steps">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;
const bul=a=>`<ul class="bul">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const body=a=>`<div class="body">${(Array.isArray(a)?a:[a]).map(x=>`<p>${x}</p>`).join('')}</div>`;
const note=(t,cls='')=>`<div class="note ${cls}">${t}</div>`;
const tbl=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th${h[0]==='#'?' class="n"':''}>${h.replace(/^#/,'')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${head[i][0]==='#'?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const C={bsm:'#4f8fe0',crypto:'#3fa66b',law:'#c0393f',mine:'#b5653a',fauna:'#d2492f',ev:'#d9a03a'};

/* ===================== МАЙНЕРЫ: БС-МАЙНЕР ===================== */
function renderBsm(){
  let h='<div class="grid">';
  h+=card('Что это',body([
    '<b>Блюспейс-майнер</b> (bluespace mining machine) медленно «добывает» материалы из других миров прямо в привязанное <b>хранилище материалов</b> (ore silo). Работает от <b>ядра блюспейс-аномалии</b>, которое за смену изнашивается.',
    'Потребление: 100 Вт в простое, <b>5 кВт</b> в работе. Каждый тик машин (2 с) кладёт в сило порцию одного случайного материала.',
    'Чем сильнее износ ядра, тем выше <b>нестабильность</b>: из майнера сыплются случайности — от торта и гондолы до аномалий, метеорита и взрыва.']),C.bsm);
  h+=card('Как получить',steps([
    'ОИР изучает узел <b>Bluespace Mining Technology</b> (5 000 очков; нужны Practical Bluespace, Advanced Mining, Anomaly Research).',
    'Печать платы <b>Machine Design (Bluespace Miner)</b> — в протолатах науки, карго или инженерии (раздел Production Machinery).',
    'Детали на корпус: по <b>5</b> матер-бинов, микролазеров, манипуляторов и сканирующих модулей + <b>5 блюспейс-кристаллов</b>.',
    'Ядро: <b>ядро блюспейс-аномалии</b> — остаётся после нейтрализации блюспейс-аномалии сигналером на её частоте (частоту показывает анализатор). Это работа ОИР.',
    'Плата иногда попадается в «1k Surplus Crate» карго.']),C.bsm);
  h+=card('Как установить',steps([
    'Соберите машину из рамы: плата, детали, кристаллы. Поставьте там, где <b>температура −10…+10 °C</b> и <b>давление 51…151 кПа</b> — вне этих рамок ядро изнашивается вдвое быстрее (оба сразу — вчетверо).',
    'Прикрутите к полу гаечным ключом (панель должна быть открыта отвёрткой), затем закройте панель.',
    'Привяжите к хранилищу материалов: мультитулом по <b>сило</b> (запомнить), затем мультитулом по майнеру.',
    'Вставьте ядро блюспейс-аномалии рукой в машину (1,5 с). Дайте питание — значок сменится на рабочий.',
    'Осмотр (Examine) показывает: эффективность, добычу кристаллов, состояние ядра, термометр (синий — норма) и барометр (зелёный — норма).']),C.bsm);
  h+=card('Обслуживание и ядро',bul([
    'Ядро рассчитано на <b>~30 минут</b> работы (конфиг), в 5% секунд износа нет — фактически ~33 минуты в нормальной атмосфере.',
    'При <b>≤50%</b> майнер пишет предупреждение в канал Науки, при <b>≤10%</b> — громко в общий канал и воет сиреной (повтор раз в минуту).',
    'Извлечь ядро: открыть панель отвёрткой → <b>ломом</b> (2 с). Так можно вовремя снять ядро до опасной фазы.',
    'Разборка ломом с открытой панелью; ядро выпадает. Стабилизатор (ядро не изнашивается) есть только у майнеров, поставленных на карте, — при разборке он теряется.',
    'Работа без вреда для ядра невозможна: нужен свежий запас ядер от ОИР, иначе майнер встанет.',
    'Майнер нагревает и охлаждает воздух вокруг себя (2% в секунду, ±25…180 °C на 1–3 клетках) — ставьте термостабилизацию и не держите рядом людей без нужды.']),C.bsm);
  h+=card('Нестабильность ядра <small>события раз в 5 минут на каждый майнер</small>',
    tbl(['Ядро','Угроза','Что бывает'],[
      ['99–51%','<span class="danger d1">низкая</span>','Плюшка, ломтик торта, еда, напиток, шприц с наркотиком, пивная кега, гондола, звуки. «Объятия пустоты» даже чинят ядро на +100.'],
      ['50–11%','<span class="danger d2">средняя</span>','Выбросы плазмы, азота, CO₂, пара, закиси азота; криогенный скачок −75…130 °C; вспышка как от флешки.'],
      ['≤10%','<span class="danger d3">высокая</span>','Аномалии рядом (в т.ч. пространственный разрыв), шторм порталов, спавн мобов, <b>взрыв майнера</b> (2/4/5), <b>метеорит класса «Тунгуска»</b> по майнеру; редко — суперматериевый меч или пульс-разрушитель.']])
    +note('Высокая угроза — это реальные разрушения отсека. Снимайте ядро до 10% или ставьте майнер подальше от людей и важных систем.','bad'),C.bsm);
  h+=card('Блокировка всех майнеров',body([
    'Через <b>устройство аутентификации ключ-картами</b> (две карты глав) есть событие «протоколы БС-майнеров»: оно останавливает все майнеры на уровне станции и объявляет «Остановка добычи ресурсов». Повторное событие снимает блокировку.',
    'Пока блокировка включена, майнеры пишут при осмотре «Все майнеры на станции отключены; свяжитесь с командованием». Майнеры вне станции (например, на Лаваленде) блокировка не трогает.']),C.bsm);
  h+='</div>';
  $('#miners-bsm').innerHTML=h;
}

/* ===================== МАЙНЕРЫ: ВЫРАБОТКА ===================== */
// ore_rates машины: доля от 1000 единиц на тик, умноженная на средний разряд деталей
const ORES=[['Железо',0.05],['Стекло',0.05],['Серебро',0.025],['Титан',0.025],['Уран',0.025],['Пластик',0.025],['Золото',0.01],['Алмаз',0.01],['Плазма',0.01]];
const CRYSTALS=[['Блюспейс-кристаллы',0.005],['Бананиум',0.005]];
const TICK=2, SHEET=2000, CORE_MIN=30, NO_DMG=1-Math.pow(1-0.05,TICK); // DT_PROB(5%, 2 с)
const TIERS=[[1,'Т1 — стандартные'],[2,'Т2 — продвинутые'],[3,'Т3 — супер / пико'],[4,'Т4 — блюспейс / фемто'],[5,'Т5 — атто / дарк-матер']];
function renderCalc(){
  const s=S.calc;
  let h='<div class="grid">';
  h+=`<div class="panel card wide" style="--kc:${C.bsm}"><h3>Калькулятор выработки БС-майнеров</h3><div class="calc">
    <div class="ctl">
      <label>Детали <select id="c-tier">${TIERS.map(([v,n])=>`<option value="${v}"${+s.tier===v?' selected':''}>${n}</option>`).join('')}</select></label>
      <label>Майнеров <input type="range" id="c-n" min="1" max="12" value="${s.n}"><b id="c-nv">${s.n}</b></label>
      <label class="chk"><input type="checkbox" id="c-t"${s.badT?' checked':''}>температура вне −10…+10 °C</label>
      <label class="chk"><input type="checkbox" id="c-p"${s.badP?' checked':''}>давление вне 51…151 кПа</label>
    </div>
    <div id="c-out"></div></div></div>`;
  h+=card('Как считается',bul([
    'Эффективность = <b>средний разряд всех 20 деталей</b> (Т1…Т5) × множитель конфига (1). Смешанные детали дают среднее.',
    'Каждые 2 с майнер выбирает <b>один случайный материал из списка</b> и кладёт <i>доля × 1000 × эффективность</i> единиц. Лист = 2000 единиц.',
    'На Т5 (все детали 5-го разряда) в список добавляются блюспейс-кристаллы и бананиум — из-за этого остальные материалы выпадают чуть реже.',
    'Майнеры <b>не мешают друг другу</b>: выработка растёт линейно, но и события нестабильности тоже — каждый майнер бросает своё событие раз в 5 минут.',

      <div class="kpi"><b>${fmt(5*s.n,0)} кВт</b><span>питание в работе</span></div>
      <div class="kpi ${s.n>=3?'warn':''}"><b>~${evPer*s.n}</b><span>событий за жизнь ядер</span></div>
      <div class="kpi ${s.tier>=5?'ok':''}"><b>${s.tier>=5?fmt(perMin(0.005)*60,1):'нет'}</b><span>блюспейс-кристаллов в час</span></div>
    </div>
    <div><div class="muted" style="font-size:12.5px;margin:6px 0 4px">Фазы одного ядра: низкая угроза с ~${fmt(tLow,1)} мин, средняя с ~${fmt(tMid,0)} мин, высокая с ~${fmt(tHigh,0)} мин, ядро разрушится на ~${fmt(life,0)} мин.</div>

    o+=tbl(['Материал','#Доля','#Листов/мин','#Листов/час','#За жизнь ядер'],list.map(([n,r])=>[n,fmt(r*100/ (list.reduce((a,x)=>a+x[1],0)),1)+'%',fmt(perMin(r),2),fmt(perMin(r)*60,1),fmt(perMin(r)*life,1)]));
    $('#c-out').innerHTML=o;
  };
  ['#c-tier','#c-n','#c-t','#c-p'].forEach(id=>$(id).addEventListener('input',upd));
  upd();

  ['sub','calc','crypto'].forEach(k=>{s[k]=Object.assign({},S0[k],s[k]||{})});
  return s})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const TABS=['miners','mine','events'];
const SUBS={miners:[['bsm','БС-майнер'],['calc','Выработка'],['crypto','Криптомайнер'],['law','Законность']],mine:[['guide','Гайд шахтёра'],['shop','Автомат'],['fauna','Фауна Лаваленда']],events:[['loan','Займ шаттла'],['other','Прочие ивенты']]};
const RENDER={miners:{bsm:renderBsm,calc:renderCalc,crypto:renderCrypto,law:renderLaw},mine:{guide:renderGuide,shop:renderShop,fauna:renderFauna},events:{loan:renderLoan,other:renderOther}};
const subSeg=t=>{const el=document.querySelector(`[data-subs="${t}"]`);el.innerHTML=SUBS[t].map(([id,n])=>`<button type="button" data-sub="${id}" aria-pressed="${S.sub[t]===id}">${n}</button>`).join('')};
function go(t,sub){
  if(PART)t=PART;
  if(sub)S.sub[t]=sub;
  if(!SUBS[t].some(([id])=>id===S.sub[t]))S.sub[t]=SUBS[t][0][0];
  S.tab=t;
  TABS.forEach(x=>{$('#v-'+x).hidden=x!==t;$('#tab-'+x).setAttribute('aria-selected',x===t)});
  subSeg(t);SUBS[t].forEach(([id])=>{$('#'+t+'-'+id).hidden=id!==S.sub[t]});
  RENDER[t][S.sub[t]]();save();setHash(t+'/'+S.sub[t]);window.scrollTo(0,0)}
function setHash(h){try{history.replaceState(null,'','#'+h)}catch(e){}}
